<script>
/* Laydback: per-package enquiry CTAs.
   Adds an "Ask about this package" button to each catalogue card in the Other Products
   section; clicking it preselects that package in the Secondary Product Enquiry form
   and scrolls to it. Injected into all site HTML shells (index/200/404/index-subpath). */
(function () {
  var MAP = [
    ['Startup GrowthStack', 'GrowthStack'],
    ['Scale GrowthStack', 'GrowthStack'],
    ['Enterprise GrowthStack', 'GrowthStack'],
    ['Full Social Media Revamp', 'Social Media Revamp or Social Growth'],
    ['Social Growth', 'Social Media Revamp or Social Growth'],
    ['Monthly Financial Health Advisory', 'Financial Health Advisory'],
    ['Professional Custom Email Signatures', 'Custom Email Signatures']
  ];
  function norm(t) { return (t || '').replace(/\s+/g, ' ').trim(); }
  function findSelect() { return document.querySelector('select[name="serviceInterest"]'); }
  function scrollToEl(el) {
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { }
    setTimeout(function () {
      var r = el.getBoundingClientRect();
      if (r.top < 0 || r.top > window.innerHeight * 0.8) {
        try { el.scrollIntoView({ block: 'center' }); } catch (e) { }
      }
    }, 900);
  }
  function ask(value) {
    var sel = findSelect();
    if (sel) {
      var opt = Array.prototype.slice.call(sel.options).filter(function (o) { return norm(o.text) === value; })[0];
      if (opt) {
        sel.value = opt.value || opt.text;
        sel.dispatchEvent(new Event('change', { bubbles: true }));
      }
      try { sel.focus({ preventScroll: true }); } catch (e) { }
      sel.style.transition = 'box-shadow .4s';
      sel.style.boxShadow = '0 0 0 3px rgba(186,251,58,.55)';
      setTimeout(function () { sel.style.boxShadow = 'none'; }, 2400);
      scrollToEl(sel);
    } else {
      var t = document.getElementById('secondary-product-enquiry-title');
      if (t) scrollToEl(t);
    }
  }
  window.__lbAskPackage = ask;
  function makeBtn(value) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Ask about this package';
    b.setAttribute('data-lb-enquiry', value);
    b.style.cssText = 'margin-top:10px;display:inline-flex;align-items:center;min-height:38px;padding:8px 14px;border:1px solid rgba(116,216,225,.35);border-radius:4px;background:rgba(116,216,225,.06);color:#eaf6ff;font-size:12px;font-weight:600;cursor:pointer;';
    b.addEventListener('click', function () { ask(value); });
    return b;
  }
  function inject() {
    var arts = document.querySelectorAll('article');
    for (var i = 0; i < arts.length; i++) {
      var a = arts[i];
      if (a.getAttribute('data-lb-cta-done')) continue;
      var h = a.querySelector('h3,h4');
      var label = h ? norm(h.textContent) : '';
      var hit = null;
      for (var j = 0; j < MAP.length; j++) {
        if (label === MAP[j][0] || label.indexOf(MAP[j][0]) === 0) { hit = MAP[j]; break; }
      }
      if (!hit) continue;
      if (a.querySelector('[data-lb-enquiry]')) { a.setAttribute('data-lb-cta-done', '1'); continue; }
      var btns = a.querySelectorAll('button,a');
      var anchor = btns.length ? btns[btns.length - 1] : null;
      var btn = makeBtn(hit[1]);
      if (anchor && anchor.parentElement) { anchor.parentElement.appendChild(btn); }
      else { a.appendChild(btn); }
      a.setAttribute('data-lb-cta-done', '1');
    }
  }
  var t = null;
  function schedule() { if (t) return; t = setTimeout(function () { t = null; try { inject(); } catch (e) { } }, 350); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', schedule);
  try { new MutationObserver(schedule).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) { }
  schedule();
  setInterval(function () { try { inject(); } catch (e) { } }, 4000);
})();

</script>
