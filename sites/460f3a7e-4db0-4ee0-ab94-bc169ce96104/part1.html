<style>
:root { /* lbq-contrast */ --bg:#1d3a33;--line:rgba(241,237,226,.18);--accent:#cfe4d8;
  --field: #1d3a33;
  --panel: #234740;
  --tile: #cfe4d8;
  --cream: #f1ede2;
  --grout: #162a25;
  --brass: #c29b58;
  --muted: rgba(241,237,226,.62);
  --tile-radius: 3px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
body {
  font-family: 'Jost', system-ui, sans-serif;
  font-weight: 400;
  line-height: 1.6;
  color: var(--cream);
  background: var(--field);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: 'Young Serif', Georgia, serif; font-weight: 400; line-height: 1.15; color: var(--cream); }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--tile); }
img { max-width: 100%; height: auto; display: block; }
.rv { opacity: 0; transform: translateY(16px); transition: opacity 0.7s ease, transform 0.7s ease; }
.js .rv.on { opacity: 1; transform: none; }
.container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; }
@media (max-width: 760px) { .container { padding: 0 16px; } }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

@media(max-width:760px){.nav-links{display:none !important}}

@media(max-width:760px){.steps{grid-template-columns:1fr 1fr !important;gap:20px !important}}
@media(max-width:460px){.steps{grid-template-columns:1fr !important}}
</style>
<noscript><style>.rv{opacity:1;transform:none}</style></noscript>
</head>
