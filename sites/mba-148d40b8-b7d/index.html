<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vestbuilt Pty Ltd — Carpenter &amp; Builder, Hunter NSW</title>
<meta name="description" content="Vestbuilt Pty Ltd — carpentry, renovations, restorations and custom joinery for homes and businesses across the Hunter, NSW. Call 0423 298 517.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#fbfcfd;
  --tint:#f3f6f8;
  --hair:#dde3e8;
  --hair-strong:#c7d0d7;
  --ink:#22282e;
  --dim:#5c6670;
  --accent:#7d95a8;
  --accent-deep:#3e566b;
  --accent-wash:#e6ecf1;
  --display:"Archivo",system-ui,sans-serif;
  --body:"Work Sans",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
body{
  font-family:var(--body);
  color:var(--ink);
  background:var(--ground);
  font-size:16px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{display:block;max-width:100%}
a{color:inherit}
.bay{
  position:relative;
  border-left:1px solid var(--hair);
  border-right:1px solid var(--hair);
  max-width:1240px;
  margin:0 auto;
}
/* ---------- top masthead ---------- */
.mast{
  position:sticky;top:0;z-index:40;
  background:rgba(251,252,253,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--hair);
}
.mast-in{
  max-width:1240px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;
}
.mast-brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.mast-brand img{height:34px;width:auto}
.mast-tel{
  font-size:13px;letter-spacing:.06em;text-decoration:none;
  color:var(--accent-deep);font-weight:500;
  border:1px solid var(--hair-strong);
  padding:9px 16px;
  transition:background .2s,color .2s;
}
.mast-tel:hover{background:var(--accent-deep);color:#fff}
/* ---------- hero ---------- */
.hero{padding:0}
.hero-grid{
  display:grid;
  grid-template-columns:minmax(0,7fr) minmax(0,5fr);
  border-bottom:1px solid var(--hair);
}
.hero-copy{
  padding:96px 56px 88px 28px;
  border-right:1px solid var(--hair);
}
.hero-tag{
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);margin-bottom:34px;
}
.hero-tag b{color:var(--accent-deep);font-weight:500}
h1{
  font-family:var(--display);
  font-weight:200;
  font-size:clamp(52px,6.6vw,88px);
  line-height:1.02;
  letter-spacing:-.025em;
  color:var(--ink);
  text-wrap:balance;
}
h1 .thin{color:var(--accent);font-weight:200}
.hero-sub{
  margin-top:34px;max-width:52ch;color:var(--dim);font-size:17px;
}
.hero-ctas{margin-top:44px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.btn{
  display:inline-block;text-decoration:none;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;
  padding:16px 30px;
  transition:background .2s,color .2s,border-color .2s;
}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid:hover{background:var(--accent-deep)}
.btn-line{border:1px solid var(--hair-strong);color:var(--ink)}
.btn-line:hover{border-color:var(--accent-deep);color:var(--accent-deep)}
.hero-media{
  position:relative;min-height:560px;
}
.hero-media img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
}
.hero-media .media-note{
  position:absolute;left:0;bottom:0;right:0;
  background:rgba(251,252,253,.9);
  border-top:1px solid var(--hair);
  padding:12px 20px;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
}
/* ---------- bay index (sticky right edge) ---------- */
@media (min-width:961px){
  body{padding-right:64px}
  .bayindex{
    position:fixed;right:0;top:50%;transform:translateY(-50%);
    z-index:50;width:64px;
    display:flex;flex-direction:column;align-items:center;gap:20px;
    border-left:1px solid var(--hair);
    background:var(--ground);
    padding:18px 0;
  }
  .bayindex::before{
    content:"";position:absolute;top:14px;bottom:14px;left:50%;width:1px;
    margin-left:-.5px;background:var(--hair-strong);
  }
}
@media (max-width:960px){
  .bayindex{display:none}
}
.bayindex a{
  width:11px;height:11px;
  border:1px solid var(--accent);
  background:var(--ground);
  display:block;
  position:relative;
  transition:background .2s;
}
.bayindex a:hover,.bayindex a.on{background:var(--accent-deep);border-color:var(--accent-deep)}
.bayindex a span{
  position:absolute;right:20px;top:50%;transform:translateY(-50%);
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent-deep);white-space:nowrap;
  opacity:0;transition:opacity .2s;
  pointer-events:none;
}
.bayindex a:hover span{opacity:1}
/* ---------- mullion section headers ---------- */
.sec{border-bottom:1px solid var(--hair)}
.sec-head{
  display:grid;
  grid-template-columns:120px minmax(0,1fr) minmax(0,1fr);
  border-bottom:1px solid var(--hair);
}
.sec-no{
  border-right:1px solid var(--hair);
  padding:26px 0 0 28px;
  font-family:var(--display);font-weight:200;font-size:44px;color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.sec-kicker{
  border-right:1px solid var(--hair);
  padding:38px 32px;
  font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  align-self:center;
}
.sec-title{
  padding:30px 32px;
  align-self:center;
}
h2{
  font-family:var(--display);font-weight:200;
  font-size:clamp(30px,3.4vw,46px);
  line-height:1.1;letter-spacing:-.015em;
  color:var(--ink);
  text-wrap:balance;
}
/* ---------- services: mullion columns ---------- */
.svc{display:grid;grid-template-columns:repeat(3,1fr)}
.svc-cell{
  border-right:1px solid var(--hair);
  border-bottom:1px solid var(--hair);
  padding:40px 32px 44px;
  min-height:280px;
  display:flex;flex-direction:column;
}
.svc-cell:nth-child(3n){border-right:none}
.svc-call{grid-column:span 2;background:var(--tint)}
.svc-call .btn{margin:18px 0 0;align-self:flex-start}
.svc-cell .no{
  font-size:12px;letter-spacing:.2em;color:var(--accent-deep);margin-bottom:60px;
  font-variant-numeric:tabular-nums;
}
.svc-cell h3{
  font-family:var(--display);font-weight:300;font-size:23px;line-height:1.2;
  letter-spacing:-.01em;margin-bottom:12px;
}
.svc-cell p{color:var(--dim);font-size:15px;max-width:34ch}
/* ---------- gallery: tall bays ---------- */
.gal{display:grid;grid-template-columns:repeat(2,1fr)}
.gal figure{
  border-right:1px solid var(--hair);
  border-bottom:1px solid var(--hair);
  margin:0;position:relative;overflow:hidden;
  background:var(--tint);
}
.gal figure:nth-child(2n){border-right:none}
.gal img{width:100%;height:100%;object-fit:cover;aspect-ratio:3/4}
.gal figcaption{
  position:absolute;left:0;bottom:0;
  background:rgba(251,252,253,.92);
  border-top:1px solid var(--hair);border-right:1px solid var(--hair);
  padding:10px 16px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
}
/* ---------- tint band sections ---------- */
.band{background:var(--tint)}
.about-grid{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
}
.about-copy{padding:64px 48px 64px 28px;border-right:1px solid var(--hair)}
.about-copy p{color:var(--dim);font-size:16px;max-width:56ch}
.about-copy p+p{margin-top:18px}
.about-copy .lead{color:var(--ink);font-size:19px;line-height:1.5}
.about-facts{padding:64px 32px;display:flex;flex-direction:column}
.fact{
  display:flex;justify-content:space-between;gap:24px;align-items:baseline;
  padding:16px 0;border-bottom:1px solid var(--hair);
}
.fact:last-child{border-bottom:none}
.fact .k{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.fact .v{font-family:var(--display);font-weight:300;font-size:19px;color:var(--ink);text-align:right}
/* ---------- approach: stepped bays ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr)}
.step{
  border-right:1px solid var(--hair);
  padding:44px 32px 52px;
}
.step:nth-child(3n){border-right:none}
.step .n{
  font-family:var(--display);font-weight:200;font-size:60px;line-height:1;
  color:var(--accent);font-variant-numeric:tabular-nums;
}
.step h3{
  font-family:var(--display);font-weight:300;font-size:21px;margin:26px 0 10px;
}
.step p{color:var(--dim);font-size:15px;max-width:32ch}
/* ---------- quotes: full-width stacked panes ---------- */
.quotes{border-bottom:1px solid var(--hair)}
.quote{
  display:grid;grid-template-columns:120px minmax(0,1fr) 220px;
  border-bottom:1px solid var(--hair);
}
.quote:last-child{border-bottom:none}
.quote .q-no{
  border-right:1px solid var(--hair);
  padding:34px 0 0 28px;
  font-family:var(--display);font-weight:200;font-size:30px;color:var(--accent);
}
.quote blockquote{
  padding:38px 40px;
  font-family:var(--display);font-weight:200;
  font-size:clamp(20px,2.1vw,27px);line-height:1.42;color:var(--ink);
  letter-spacing:-.005em;
}
.quote .q-who{
  border-left:1px solid var(--hair);
  padding:38px 24px;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  align-self:end;
}
/* ---------- contact ---------- */
.contact{background:var(--ink);color:#f4f6f8}
.contact .sec-head{border-bottom:1px solid #3a4149}
.contact .sec-no{color:var(--accent);border-right-color:#3a4149}
.contact .sec-kicker{border-right-color:#3a4149;color:#9aa6b0}
.contact-in{
  display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);
}
.contact-copy{padding:72px 48px 80px 28px;border-right:1px solid #3a4149}
.contact-copy p{color:#b6c0c8;max-width:52ch;font-size:16px}
.tel-hero{
  display:inline-block;margin-top:30px;
  font-family:var(--display);font-weight:200;
  font-size:clamp(44px,5.4vw,72px);letter-spacing:-.01em;
  color:#fff;text-decoration:none;
  font-variant-numeric:tabular-nums;
}
.tel-hero:hover{color:var(--accent)}
.contact-side{padding:72px 32px 80px}
.contact-side .fact{border-bottom:1px solid #3a4149}
.contact-side .fact .k{color:#9aa6b0}
.contact-side .fact .v{color:#f4f6f8;font-size:17px}
.contact-side .fact a{color:#f4f6f8;text-decoration:none;border-bottom:1px solid #4a525a}
.contact-side .fact a:hover{color:var(--accent);border-color:var(--accent)}
/* ---------- footer ---------- */
footer{border-top:1px solid var(--hair)}
.foot-in{
  max-width:1240px;margin:0 auto;
  display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between;
  padding:26px 28px;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
}
.foot-in a{color:var(--dim);text-decoration:none}
.foot-in a:hover{color:var(--accent-deep)}
/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(14px);transition: opacity .45s ease,transform .6s ease}
.rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
/* ---------- responsive ---------- */
@media (max-width:960px){
  .hero-grid{grid-template-columns:1fr}
  .hero-copy{border-right:none;padding:64px 24px 56px}
  .hero-media{min-height:420px}
  .sec-head{grid-template-columns:84px 1fr}
  .sec-no{padding:20px 0 0 20px;font-size:34px}
  .sec-kicker{grid-column:1 / -1;border-right:none;border-top:1px solid var(--hair);padding:12px 20px}
  .sec-title{padding:24px 20px}
  .svc{grid-template-columns:1fr 1fr}
  .svc-cell:nth-child(3n){border-right:1px solid var(--hair)}
  .svc-cell:nth-child(2n){border-right:none}
  .gal{grid-template-columns:1fr 1fr}
  .gal figure:nth-child(2n){border-right:1px solid var(--hair)}
  .gal figure:nth-child(2n+1){border-right:none}
  .about-grid{grid-template-columns:1fr}
  .about-copy{border-right:none;padding:48px 24px}
  .about-facts{padding:8px 24px 40px}
  .steps{grid-template-columns:1fr}
  .step{border-right:none;border-bottom:1px solid var(--hair)}
  .quote{grid-template-columns:64px 1fr}
  .quote .q-who{grid-column:2;border-left:none;border-top:1px solid var(--hair);padding:14px 24px 22px}
  .contact-in{grid-template-columns:1fr}
  .contact-copy{border-right:none;padding:56px 24px}
  .contact-side{padding:8px 24px 56px}
}
@media (max-width:560px){
  .svc{grid-template-columns:1fr}
  .svc-cell{border-right:none!important}
  .svc-call{grid-column:auto}
  .svc-cell .no{margin-bottom:28px}
  .gal{grid-template-columns:1fr}
  .gal figure{border-right:none!important}
  .mast-in{padding:12px 18px}
  .mast-brand img{height:28px}
  .mast-tel{padding:8px 12px;font-size:12px}
}
</style>

// JS Safety net: reveal all hidden elements after 1100ms
setTimeout(function() {
    var hiddenEls = document.querySelectorAll('.rv, .step, [class*="hide"], [class*="hidden"]');
    hiddenEls.forEach(function(el) {
        el.style.opacity = "1";
        el.style.transform = "none";
    });
}, 1100);
// JS Safety net: reveal all hidden elements after 1100ms (matching reference pattern)
setTimeout(function() {

}, 1100);

  <style>

  <div class="lbq-w">
      <h2 id="lbq-h">Request a quote</h2>
      <p class="lbq-s">Tell us a few details and we&#39;ll get back to you with a free, no-obligation quote.</p><form id="lbq-form" novalidate data-site="mba-148d40b8-b7d" data-biz="Vestbuilt Pty Ltd"><div class="lbq-g"><div><label for="lbq-n">Name</label><input id="lbq-n" name="name" autocomplete="name" required></div><div><label for="lbq-p">Phone</label><input id="lbq-p" name="phone" type="tel" autocomplete="tel"></div><div><label for="lbq-e">Email</label><input id="lbq-e" name="email" type="email" autocomplete="email"></div><div class="lbq-full"><label for="lbq-m">Tell us about the job</label><textarea id="lbq-m" name="message" placeholder="Size, location, time frame&#8230;" required></textarea></div></div><label class="lbq-cons"><input type="checkbox" name="consent" value="1" checked> I agree to be contacted about this request.</label><div class="lbq-hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><button type="submit">Send quote request</button><p class="lbq-st" id="lbq-st" role="status" aria-live="polite"></p></form>
  </div>
  <script>
(function(){
  var EP = null;
  function base(cb){
    if (window.__LAYDBACK_API_BASE) return cb(window.__LAYDBACK_API_BASE);
    var done = false;
    var t = setTimeout(function(){ if(!done){done=true;cb('https://grocery-periodically-everyone-wine.trycloudflare.com');} }, 2500);
    fetch('https://gist.githubusercontent.com/laydbackapps-beep/48ff985c786b72a1637d7875f4df79b8/raw/api-base.txt?_=' + Date.now())
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var b = (txt||'').trim().replace(/\/+$/, '');
        if (done) return;
        done = true; clearTimeout(t);
        cb(/^https:\/\/[a-z0-9.\-]+(:\d+)?$/i.test(b) ? b : 'https://grocery-periodically-everyone-wine.trycloudflare.com');
      })
      .catch(function(){ if(!done){done=true;clearTimeout(t);cb('https://grocery-periodically-everyone-wine.trycloudflare.com');} });
  }
  function init(){
    var f = document.getElementById('lbq-form');
    if (!f) return;
    var st = document.getElementById('lbq-st');
    var btn = f.querySelector('button[type=submit]');
    f.addEventListener('submit', function(e){
      e.preventDefault();
      var d = {};
      new FormData(f).forEach(function(v,k){ d[k]=v; });
      if (d.website) return;  // honeypot — silently accept bots
      if (!d.name || (!d.phone && !d.email) || !(d.message||'').trim()) {
        st.textContent = 'Please add your name, a phone or email, and a few words about the job.';
        st.style.color = '#ff9d8a';
        return;
      }
      btn.disabled = true;
      st.textContent = 'Sending\u2026';
      st.style.color = '';
      base(function(B){
        var url = (B === 'https://grocery-periodically-everyone-wine.trycloudflare.com' ? 'https://grocery-periodically-everyone-wine.trycloudflare.com' : B) + '/functions/v1/quote-request';
        fetch(url, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            site_id: f.dataset.site || '',
            business_name: f.dataset.biz || '',
            name: d.name, phone: d.phone, email: d.email,
            service: d.service || '', message: d.message,
            consent: !!d.consent
          })
        })
        .then(function(r){ return r.json().catch(function(){ return {}; }); })
        .then(function(x){
          if (x && x.success) {
            f.reset();
            st.textContent = "Thanks \u2014 your request is in. We'll be in touch shortly.";
            st.style.color = 'var(--lbq-accent)';
          } else {
            throw new Error((x && x.error) || 'Could not send');
          }
        })
        .catch(function(err){
          st.textContent = (err && err.message) ? err.message : 'Could not send \u2014 please try again or call.';
          st.style.color = '#ff9d8a';
        })
        .finally(function(){ btn.disabled = false; });
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
