<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sneddon Building Services — Builder in Central Coast, NSW. New Home Builds, Home Renovations, Home Extensions, Granny Flats, Bathroom Renovations, Kitchen Renovations, Decking, Outdoor Areas.">
  <title>Sneddon Building Services — Builder in Central Coast, NSW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800&family=Figtree:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon-192.png">
  <script>document.documentElement.classList.add('js');</script>
  <style>
    :root {
      --field: #f4f7f9;
      --band: #e9eef3;
      --ink: #10283c;
      --accent: #0e8fd0;
      --accent-deep: #005696;
      --text: #3f454b;
      --navy: #0c1f30;
      --hairline: rgba(16,40,60,.14);
      --font-display: 'Epilogue', system-ui, sans-serif;
      --font-body: 'Figtree', system-ui, sans-serif;
      --font-mono: 'Red Hat Mono', ui-monospace, monospace;
      --chamfer: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html.js .rv { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    html.js .rv.on { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      html.js .rv { opacity: 1; transform: none; transition: none; }
      #hero-canvas { animation: none !important; }
      .drift-layer { animation: none !important; }
    }
    body {
      font-family: var(--font-body);
      color: var(--text);
      background: var(--field);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: min(100% - 3rem, 1200px); margin-inline: auto; }
    h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.15; color: var(--ink); }
    h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; }
    h2 { font-size: clamp(1.75rem, 3.5vw, 2.5rem); }
    h3 { font-size: clamp(1.125rem, 2vw, 1.375rem); }
    p { font-size: clamp(1rem, 1.2vw, 1.125rem); }
    .mono { font-family: var(--font-mono); font-size: .8125rem; color: var(--text); opacity: .8; }
    a { color: var(--accent-deep); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; height: auto; display: block; }
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .875rem 1.5rem; border-radius: 999px;
      font-family: var(--font-body); font-weight: 600; font-size: 1rem;
      border: 2px solid transparent; cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
    }
    .btn-primary { background: var(--accent-deep); color: #fff; }
    .btn-primary:hover { background: #00447a; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
    .btn-ghost:hover { background: var(--ink); color: #fff; }
    .diamond-glyph {
      display: inline-block; width: 10px; height: 10px;
      background: var(--accent-deep);
      transform: rotate(45deg);
      margin-right: .75rem;
      flex-shrink: 0;
    }
    .diamond-rule {
      display: flex; align-items: center; gap: .5rem;
      margin-bottom: 1rem;
    }
    .diamond-rule::before, .diamond-rule::after {
      content: ""; flex: 1; height: 1px; background: var(--hairline);
    }
    .diamond-rule .diamond-glyph { margin: 0; }
    .chamfer-card {
      clip-path: polygon(
        var(--chamfer) 0, calc(100% - var(--chamfer)) 0,
        100% var(--chamfer), 100% calc(100% - var(--chamfer)),
        calc(100% - var(--chamfer)) 100%, var(--chamfer) 100%,
        0 calc(100% - var(--chamfer)), 0 var(--chamfer)
      );
      border: 1px solid var(--hairline);
      background: #fff;
      padding: 2rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .chamfer-card:hover { border-color: var(--accent); box-shadow: 0 8px 32px rgba(16,40,60,.08); }

    /* ===== NAV ===== */
    html { scroll-padding-top: 84px; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .nav { position: sticky; top: 0; z-index: 60; background: rgba(244,247,249,.94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--hairline); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; padding: .8rem 0; }
    .logo { display: inline-flex; align-items: center; }
    .logo img { width: 170px; height: auto; }
    .nav-links { display: flex; align-items: center; gap: 1.4rem; font-weight: 500; font-size: .95rem; }
    .nav-links a { color: var(--ink); }
    .nav-links a:hover { color: var(--accent-deep); text-decoration: none; }
    .nav-cta { padding: .6rem 1.1rem; font-size: .9rem; }
    .nav-burger { display: none; flex-direction: column; gap: 4px; width: 40px; height: 40px; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--hairline); border-radius: 8px; cursor: pointer; }
    .nav-burger span { display: block; width: 18px; height: 2px; background: var(--ink); }
    .nav-drawer { display: none; }
    .nav-drawer summary { display: none; }
    .nav-drawer a { display: block; padding: .55rem 0; color: var(--ink); font-weight: 500; }
    @media (max-width: 880px) {
      .nav-links { display: none; }
      .nav-burger { display: inline-flex; }
      .nav-drawer { position: absolute; top: 100%; left: 0; right: 0; background: var(--field); border-bottom: 1px solid var(--hairline); padding: .75rem 1.5rem 1rem; box-shadow: 0 18px 30px rgba(12,31,48,.08); }
      .nav-drawer[open] { display: block; }
      .nav-drawer .btn { margin-top: .5rem; display: inline-flex; }
    }
    /* ===== HERO ===== */
    #hero { position: relative; overflow: hidden; background: var(--navy); color: #eaf1f7; display: flex; align-items: flex-end; min-height: min(88vh, 820px); }
    #hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .hero-inner { position: relative; z-index: 1; padding: 7rem 0 4rem; }
    .hero-copy { max-width: 660px; }
    .hero-copy h1 { color: #fff; margin: .9rem 0 1rem; }
    .hero-sub { color: #c9d6e2; max-width: 54ch; }
    .hero-ctas { display: flex; flex-wrap: wrap; gap: .9rem; margin-top: 1.6rem; }
    #hero .btn-ghost { color: #eaf1f7; border-color: rgba(234,241,247,.55); }
    #hero .btn-ghost:hover { background: #eaf1f7; color: var(--navy); }
    .hero-ctas .btn-primary .mono { color: inherit; opacity: 1; }
    .hero-meta { margin-top: 2.2rem; color: #8fa3b5; opacity: 1; letter-spacing: .06em; }
    .hero-copy .diamond-glyph { background: var(--accent); }
    #hero .btn-primary { background: var(--accent); color: var(--navy); }
    #hero .btn-primary:hover { background: #6fb9e6; }
    /* ===== CRED STRIP ===== */
    .cred-strip { background: var(--band); border-bottom: 1px solid var(--hairline); }
    .cred-inner { display: flex; flex-wrap: wrap; gap: .75rem 2.25rem; justify-content: space-between; padding: 1rem 0; }
    .cred-item .mono { color: var(--accent-deep); opacity: 1; text-transform: uppercase; letter-spacing: .1em; font-size: .72rem; }
    /* ===== THE WORK ===== */
    #work { padding: 5.5rem 0 4.5rem; }
    .work-grid { display: grid; grid-template-columns: minmax(0,1.18fr) minmax(0,1fr); gap: 1.5rem; margin-top: 1.6rem; align-items: start; }
    .work-item { margin: 0; }
    .work-item img { width: 100%; height: auto; object-fit: cover; border: 1px solid var(--hairline); }
    .work-item.tall img { aspect-ratio: 4 / 5; }
    .work-item.wide { margin-top: 3.2rem; }
    .work-item.wide img { aspect-ratio: 16 / 10; }
    .work-item figcaption { margin-top: .65rem; color: var(--accent-deep); opacity: 1; text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; }
    @media (max-width: 780px) { .work-grid { grid-template-columns: 1fr; } .work-item.wide { margin-top: 0; } }
    /* ===== SERVICES ===== */
    #services { padding: 4.5rem 0 5rem; background: #fff; border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); }
    .services-grid { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: .9rem; margin-top: 1.6rem; }
    .services-grid .chamfer-card { padding: 1.35rem 1.25rem 1.45rem; display: flex; flex-direction: column; gap: .45rem; }
    .services-grid .chamfer-card h3 { font-size: 1.02rem; }
    .services-grid .chamfer-card p { font-size: .88rem; color: var(--text); }
    .services-grid .chamfer-card::after { content: ""; width: 8px; height: 8px; background: var(--accent); transform: rotate(45deg); margin-top: auto; }
    @media (max-width: 1040px) { .services-grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 560px) { .services-grid { grid-template-columns: 1fr; } }
    /* ===== STATEMENT ===== */
    .statement { background: var(--band); }
    .statement-inner { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(0,.95fr); gap: 3rem; padding: 5rem 0; align-items: center; }
    .statement-copy h2 { margin-bottom: .9rem; }
    .statement-copy p { max-width: 56ch; }
    .statement-imgs { display: grid; gap: 1rem; }
    .statement-imgs figure { margin: 0; }
    .statement-imgs img { width: 100%; height: auto; border: 1px solid var(--hairline); }
    .statement-imgs figcaption { margin-top: .55rem; color: var(--accent-deep); opacity: 1; text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; }
    @media (max-width: 880px) { .statement-inner { grid-template-columns: 1fr; gap: 2rem; padding: 3.5rem 0; } }
    /* ===== PROCESS ===== */
    #process { padding: 5rem 0; }
    .process-list { list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 1.4rem; margin-top: 2.2rem; }
    .process-list li { position: relative; padding-top: 1.7rem; }
    .process-list li::before { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 1px; background: var(--hairline); }
    .process-list li::after { content: ""; position: absolute; top: 0; left: 0; width: 11px; height: 11px; background: var(--accent-deep); transform: rotate(45deg); }
    .process-list h3 { font-size: 1.02rem; margin-bottom: .35rem; }
    .process-list p { font-size: .9rem; }
    @media (max-width: 880px) { .process-list { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .process-list { grid-template-columns: 1fr; } }
    /* ===== OUTDOOR BAND ===== */
    .outdoor { position: relative; }
    .outdoor-figure { margin: 0; position: relative; }
    .outdoor-figure img { width: 100%; height: auto; max-height: 76vh; object-fit: cover; display: block; }
    .outdoor-figure figcaption { position: absolute; left: 50%; transform: translateX(-50%); bottom: 1.2rem; background: rgba(12,31,48,.74); color: #eaf1f7; opacity: 1; padding: .45rem .95rem; letter-spacing: .14em; text-transform: uppercase; font-size: .68rem; }
    /* ===== FOOTER ===== */
    .site-foot { background: var(--navy); color: #c7d3de; }
    .foot-in { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(0,1fr) minmax(0,.85fr) minmax(0,.75fr); gap: 2.2rem; padding: 4rem 0 3rem; }
    .foot-brand img { width: 180px; height: auto; margin-bottom: 1.1rem; }
    .site-foot h3 { color: #eaf1f7; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; margin-bottom: .95rem; }
    .site-foot a { color: #eaf1f7; display: block; margin-bottom: .55rem; }
    .site-foot a:hover { color: #7fd4ff; }
    .site-foot .mono { color: #93a7b8; opacity: 1; }
    .foot-phone { font-size: 1.15rem; font-weight: 600; }
    .foot-legal { border-top: 1px solid rgba(255,255,255,.14); padding: 1.05rem 0 1.3rem; }
    .foot-legal span { font-size: .78rem; color: #8fa3b5; }
    footer #lbq { --lbq-bg: var(--navy); --lbq-ink: #eaf1f7; --lbq-muted: #9db0c1; --lbq-panel: rgba(255,255,255,.05); --lbq-line: rgba(255,255,255,.16); }
    @media (max-width: 940px) { .foot-in { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 560px) { .foot-in { grid-template-columns: 1fr; gap: 1.6rem; } }
  </style>
</head>
<body>
