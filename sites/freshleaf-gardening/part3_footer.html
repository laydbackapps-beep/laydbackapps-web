<script>
(function(){
  var b = document.getElementById('burger'), n = document.getElementById('navlinks');
  if (b && n){
    b.addEventListener('click', function(){
      var open = n.classList.toggle('open');
      b.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    n.addEventListener('click', function(e){
      if (e.target.tagName === 'A'){ n.classList.remove('open'); b.classList.remove('open'); b.setAttribute('aria-expanded','false'); }
    });
  }
})();

(function(){
  var els = document.querySelectorAll('.drop');
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -40px 0px'});
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add('in'); });
  }
})();

setTimeout(function(){
  document.querySelectorAll('.drop').forEach(function(el){ el.classList.add('in'); });
}, 1100);


(function(){
  var c = document.getElementById('heroCanvas');
  if (!c || !c.getContext) return;
  var ctx = c.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var px = 0, py = 0;
  window.addEventListener('pointermove', function(e){
    px = (e.clientX / window.innerWidth - 0.5) * 16;
    py = (e.clientY / window.innerHeight - 0.5) * 9;
  }, {passive: true});
  function resize(){
    W = c.clientWidth || c.offsetWidth;
    H = c.clientHeight || c.offsetHeight;
    if (!W || !H) return;
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function loop(t){
    if (!W || !H){ resize(); return; }
    frame(t || 0);
    if (!reduce) requestAnimationFrame(loop);
  }
  function frame(t){

    var time = t * 0.001;
    ctx.clearRect(0,0,W,H);
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0E2416'); g.addColorStop(.55,'#14351F'); g.addColorStop(1,'#0E2416');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    /* perspective garden rows converging to a vanishing point */
    var vpx = W*0.5 + px, vpy = H*0.30 + py;
    for (var i=0;i<9;i++){
      var rowY = H*0.30 + Math.pow(i/9,1.35)*H*0.75;
      ctx.strokeStyle = 'rgba(120,180,130,' + (0.10 + i*0.012) + ')';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(0,rowY); ctx.lineTo(W,rowY); ctx.stroke();
    }
    for (var j=0;j<7;j++){
      var fx = (j/6);
      ctx.strokeStyle = 'rgba(120,180,130,0.12)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(vpx, vpy); ctx.lineTo(fx*W*1.6 - W*0.3 + px, H*1.06); ctx.stroke();
    }
    /* drifting leaves */
    for (var k=0;k<26;k++){
      var lx = (k*137.5 + time*22*(0.4+(k%5)*0.14)) % (W+80) - 40;
      var ly = H*0.34 + ((k*97.3 + time*14*(0.3+(k%4)*0.2)) % (H*0.6));
      var sw = Math.sin(time*0.8 + k)*0.6;
      ctx.save(); ctx.translate(lx, ly); ctx.rotate(sw);
      ctx.fillStyle = 'rgba(150,210,150,' + (0.10 + (k%3)*0.05) + ')';
      ctx.beginPath(); ctx.ellipse(0,0,7,3,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    /* sun glow */
    var sg = ctx.createRadialGradient(W*0.78, H*0.18, 4, W*0.78, H*0.18, 180);
    sg.addColorStop(0,'rgba(214,255,170,0.16)'); sg.addColorStop(1,'rgba(214,255,170,0)');
    ctx.fillStyle = sg; ctx.fillRect(0,0,W,H);

  }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(loop);
})();
</script>
