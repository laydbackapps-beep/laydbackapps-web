<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alora CRM · Bookings</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#211a15;--line:rgba(75,54,39,.2);--gold:#d9b079;--paper:#f7eddf;--muted:#8b7564}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.6 Montserrat,system-ui,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:16px 24px;background:var(--ink);color:#fffbee}
header b{font-family:Italiana,serif;font-size:26px;font-weight:400}header span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,251,238,.6)}
main{max-width:1200px;margin:0 auto;padding:24px}
.login{max-width:420px;margin:12vh auto;background:#fffdf7;border:1px solid var(--line);padding:28px}
label{display:grid;gap:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input,select,button{font:inherit;padding:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button{cursor:pointer;background:var(--gold);border-color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
button.ghost{background:transparent;border-color:var(--line);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fffdf7;border:1px solid var(--line);padding:14px}
.stat b{display:block;font-family:Italiana,serif;font-size:34px;font-weight:400;line-height:1}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:0 0 14px}
table{width:100%;border-collapse:collapse;background:#fffdf7;border:1px solid var(--line)}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px}
th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:#f7eddf;position:sticky;top:0}
td small{display:block;color:var(--muted);font-size:10px}
.badge{display:inline-block;padding:3px 7px;border:1px solid var(--line);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.badge.confirmed{background:#eaf2ec;border-color:#b9d4c3}.badge.cancelled{background:#f6e2df;border-color:#d8aaa4}.badge.completed{background:#e8eef4;border-color:#b8c9d8}
select{padding:5px;font-size:10px}
.tablewrap{overflow:auto;max-height:65vh}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:700px){main{padding:14px}.stats{grid-template-columns:1fr 1fr}header{padding:12px 14px}}
</style>
<script src="../book/config.js"></script>
</head>
<body>
<header><b>Hair by Alora</b><span>Bookings CRM</span></header>
<main>
  <section id="login" class="login">
    <label>Owner access token<input id="token" type="password" autocomplete="current-password"></label>
    <p style="font-size:11px;color:var(--muted)">Enter the owner token configured for the booking API.</p>
    <button id="login-btn" style="width:100%">Open bookings</button>
    <p id="login-error" style="color:#9d2f25;font-size:12px"></p>
  </section>
  <section id="app" hidden>
    <div class="stats">
      <div class="stat"><b id="s-total">0</b><span>Total bookings</span></div>
      <div class="stat"><b id="s-week">0</b><span>Next 7 days</span></div>
      <div class="stat"><b id="s-revenue">$0</b><span>Booked value</span></div>
      <div class="stat"><b id="s-hours">0</b><span>Chair hours</span></div>
    </div>
    <div class="toolbar">
      <label>Filter <select id="filter"><option value="all">All</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="no_show">No show</option></select></label>
      <label>Search <input id="search" placeholder="Name, phone, reference"></label>
      <button class="ghost" id="refresh">Refresh</button>
      <button class="ghost" id="csv">Export CSV</button>
      <button class="ghost" id="logout">Lock</button>
    </div>
    <div class="tablewrap"><table><thead><tr><th>When</th><th>Client</th><th>Service</th><th>Value</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="empty" id="empty" hidden>No bookings match.</p>
    <h2 style="font-family:Italiana,serif;font-weight:400;font-size:28px;margin:34px 0 12px">Gift voucher orders</h2>
    <div class="tablewrap"><table><thead><tr><th>Ordered</th><th>Purchaser</th><th>Recipient</th><th>Value</th><th>Status</th></tr></thead><tbody id="vrows"></tbody></table></div>
    <p class="empty" id="vempty" hidden>No voucher orders yet.</p>
  </section>
</main>
<script>
const API=(window.ALORA_API||'').replace(/\/$/,'');
let token=sessionStorage.getItem('alora_admin')||'', rows=[], vouchers=[];
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n||0);
async function load(){
  const h={'X-Admin-Token':token};
  const [rb,rv]=await Promise.all([fetch(API+'/admin/bookings',{headers:h}),fetch(API+'/admin/vouchers',{headers:h})]);
  if(!rb.ok){throw new Error(rb.status===401?'Token rejected.':'Could not load bookings.')}
  rows=(await rb.json()).bookings||[]; vouchers=rv.ok?(await rv.json()).vouchers||[]:[]; render(); renderVouchers();
}
function renderVouchers(){
  $('#vrows').innerHTML=vouchers.map(v=>`<tr>
    <td><b>${new Date(v.created_at).toLocaleDateString('en-AU',{day:'numeric',month:'short'})}</b><small>${v.ref}</small></td>
    <td><b>${esc(v.purchaser)}</b><small>${esc(v.email)}</small><small>${esc(v.phone||'')}</small></td>
    <td>${esc(v.recipient||'—')}${v.message?`<small>${esc(v.message)}</small>`:''}</td>
    <td>${money(v.amount)}</td>
    <td><span class="badge">${v.status.replace('_',' ')}</span><small><select data-vref="${v.ref}">${['pending_payment','paid','sent','cancelled'].map(s=>`<option ${s===v.status?'selected':''}>${s}</option>`).join('')}</select></small></td>
  </tr>`).join('');
  $('#vempty').hidden=vouchers.length>0;
  document.querySelectorAll('[data-vref]').forEach(s=>s.onchange=async()=>{
    const r=await fetch(API+'/admin/vouchers/'+s.dataset.vref,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Token':token},body:JSON.stringify({status:s.value})});
    if(r.ok){await load()}else{alert('Could not update')}
  });
}
function render(){
  const f=$('#filter').value,q=$('#search').value.toLowerCase();
  const visible=rows.filter(b=>(f==='all'||b.status===f)&&(!q||[b.name,b.phone,b.email,b.ref,b.service_names].join(' ').toLowerCase().includes(q)));
  $('#s-total').textContent=rows.length;
  const today=new Date();const week=new Date();week.setDate(today.getDate()+7);
  $('#s-week').textContent=rows.filter(b=>new Date(b.date+'T12:00')>=today&&new Date(b.date+'T12:00')<=week&&b.status!=='cancelled').length;
  $('#s-revenue').textContent=money(rows.filter(b=>b.status!=='cancelled').reduce((n,b)=>n+b.price,0));
  $('#s-hours').textContent=(rows.filter(b=>b.status!=='cancelled').reduce((n,b)=>n+b.duration,0)/60).toFixed(1);
  $('#rows').innerHTML=visible.map(b=>`<tr>
    <td><b>${new Date(b.date+'T12:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}</b><small>${b.start_time}–${b.end_time} · ${b.duration}m</small><small>${b.ref}</small></td>
    <td><b>${esc(b.name)}</b><small><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a></small><small><a href="mailto:${esc(b.email)}">${esc(b.email)}</a></small></td>
    <td>${esc(b.service_names)}${b.notes?`<small>${esc(b.notes)}</small>`:''}</td>
    <td>${money(b.price)}</td>
    <td><span class="badge ${b.status}">${b.status.replace('_',' ')}</span><small><select data-ref="${b.ref}">${['confirmed','completed','cancelled','no_show'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></small></td>
  </tr>`).join('');
  $('#empty').hidden=visible.length>0;
  document.querySelectorAll('[data-ref]').forEach(s=>s.onchange=async()=>{
    const r=await fetch(API+'/admin/bookings/'+s.dataset.ref,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Token':token},body:JSON.stringify({status:s.value})});
    if(r.ok){await load()}else{alert('Could not update')}
  });
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#login-btn').onclick=async()=>{
  token=$('#token').value.trim();$('#login-error').textContent='';
  try{await load();sessionStorage.setItem('alora_admin',token);$('#login').hidden=true;$('#app').hidden=false}catch(e){$('#login-error').textContent=e.message}
};
$('#refresh').onclick=()=>load().catch(e=>alert(e.message));
$('#filter').onchange=render;$('#search').oninput=render;
$('#logout').onclick=()=>{sessionStorage.removeItem('alora_admin');location.reload()};
$('#csv').onclick=()=>{location.href=API+'/admin/bookings.csv?token='+encodeURIComponent(token)};
if(token){load().then(()=>{$('#login').hidden=true;$('#app').hidden=false}).catch(()=>{})}
</script>
</body>
</html>
