<style>
:root{
  --ply:#d9c7a8;
  --ply-deep:#c9b28c;
  --ply-pale:#e7dcc4;
  --ink:#2b2620;
  --rust:#b4532a;
  --rust-ink:#9a3f1d;
  --label:#57493a;
  --paper:#f4efe6;
  --seam:2px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--ply);
  color:var(--ink);
  font-family:'Work Sans',system-ui,sans-serif;
  font-size:17px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--rust);color:var(--paper)}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- pegboard nav ---------- */
.pegboard{
  position:sticky;top:0;z-index:50;
  background:var(--ply);
  border-bottom:var(--seam) solid var(--ink);
  background-image:radial-gradient(var(--ply-deep) 2.2px, transparent 2.6px);
  background-size:26px 26px;
  background-position:6px 6px;
}
.peg-inner{
  max-width:1240px;margin:0 auto;
  padding:14px 24px;
  display:flex;align-items:center;gap:20px;
  background:
    linear-gradient(var(--ply),var(--ply)) padding-box;
  background-color:rgba(217,199,168,.92);
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand img{display:block;height:32px;width:auto;object-fit:contain;border-radius:6px}
.brand-name{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.brand-name small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10px;letter-spacing:.18em;color:var(--label)}
.peg-links{margin-left:auto;display:flex;gap:26px;align-items:center}
.peg-links a{color:var(--ink);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;position:relative;padding-left:14px}
.peg-links a::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--ink)}
.peg-links a:hover::before{background:var(--rust)}
.peg-tel{
  background:var(--rust);color:var(--paper)!important;padding:10px 16px;
  font-weight:500;border:2px solid var(--ink);white-space:nowrap;
}
.peg-tel::before{display:none}
.peg-tel:hover{background:var(--ink)}

/* ---------- bento machinery ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.bento{
  display:grid;gap:var(--seam);
  background:var(--ink); /* seam lines show through gaps */
  border:var(--seam) solid var(--ink);
}
.cell{padding:30px 30px 34px;position:relative}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition: opacity .45s ease,transform .7s ease}
.rv.on{opacity:1;transform:none}
noscript .rv,noscript .rv.on{opacity:1;transform:none}

.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--rust-ink);display:flex;align-items:center;gap:10px;margin-bottom:18px;
}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--rust)}

/* ---------- hero ---------- */
.hero{margin-top:26px;grid-template-columns:repeat(12,1fr);grid-auto-rows:auto}
.hero-display{
  grid-column:span 8;grid-row:span 2;
  background:var(--ply);
  padding:46px 44px 50px;
  display:flex;flex-direction:column;
}
.hero-display h1{
  font-family:'Archivo Black',sans-serif;
  font-size:clamp(44px,6.2vw,86px);
  line-height:.96;
  letter-spacing:-.015em;
  text-transform:uppercase;
  margin:auto 0 0;
}
.hero-display h1 .rust{color:var(--rust)}
.hero-display .lede{max-width:46ch;font-size:18px;margin-top:26px;color:#4a4238}
.hero-cta{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{
  display:inline-block;text-decoration:none;
  font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  padding:15px 24px;border:2px solid var(--ink);
}
.btn-rust{background:var(--rust);color:var(--paper)}
.btn-rust:hover{background:var(--ink)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--paper)}
.hero-logo{
  grid-column:span 4;
  background:#ffffff;
  display:flex;align-items:center;justify-content:center;
  padding:34px;
}
.hero-logo img{width:min(300px,80%);height:auto;display:block}
.hero-spec{
  grid-column:span 4;
  background:var(--ply-pale);
  padding:22px 26px;
}
.spec-row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed #b9a985;font-family:'IBM Plex Mono',monospace;font-size:12.5px;letter-spacing:.06em}
.spec-row:last-child{border-bottom:0}
.spec-row b{font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:#6b5f4d}
.spec-row span{text-align:right}

/* ---------- services ---------- */
.svcs{margin-top:var(--seam);grid-template-columns:repeat(12,1fr)}
.svc{background:var(--ply);padding:34px 32px 38px}
.svc-a{grid-column:span 7}
.svc-b{grid-column:span 5}
.svc-c{grid-column:span 4}
.svc-tag{
  grid-column:span 4;
  background:var(--rust);color:var(--paper);
  display:flex;flex-direction:column;justify-content:center;
}
.svc-tag .eyebrow{color:var(--paper)}
.svc-tag .eyebrow::before{background:var(--paper)}
.svc-tag blockquote{
  font-family:'Archivo Black',sans-serif;
  font-size:clamp(22px,2.4vw,32px);line-height:1.08;text-transform:uppercase;
}
.svc-tag cite{display:block;margin-top:14px;font-family:'IBM Plex Mono',monospace;font-style:normal;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.svc-dots{
  grid-column:span 4;
  background:var(--ply);
  background-image:radial-gradient(var(--ply-deep) 2.4px, transparent 2.8px);
  background-size:24px 24px;
  background-position:4px 4px;
  min-height:180px;
}
.svc h3{font-family:'Archivo Black',sans-serif;font-size:24px;text-transform:uppercase;letter-spacing:.01em;margin-bottom:12px}
.svc p{color:#4a4238;max-width:52ch}
.svc .num{
  position:absolute;top:26px;right:28px;
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--rust-ink);letter-spacing:.12em;
}

/* ---------- approach ---------- */
.appr{margin-top:var(--seam);grid-template-columns:repeat(3,1fr)}
.appr .cell{background:var(--ply-pale);padding-top:34px}
.appr .cell::before{content:"";display:block;width:44px;height:6px;background:var(--ink);margin-bottom:22px}
.appr .cell:nth-child(2)::before{background:var(--rust)}
.appr h3{font-family:'Archivo Black',sans-serif;font-size:20px;text-transform:uppercase;margin-bottom:10px}
.appr p{color:#4a4238;font-size:16px}
.appr .step{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.2em;color:#6b5f4d;display:block;margin-bottom:8px}

/* ---------- area ---------- */
.area{
  margin-top:var(--seam);
  background:var(--ink);color:var(--ply);
  padding:34px 32px;
  display:flex;flex-wrap:wrap;gap:18px 40px;align-items:baseline;
}
.area .eyebrow{color:var(--rust);margin-bottom:0}
.area .eyebrow::before{background:var(--rust)}
.area p{font-family:'Archivo Black',sans-serif;font-size:clamp(20px,2.6vw,30px);text-transform:uppercase;line-height:1.15}

/* ---------- contact ---------- */
.contact{margin-top:var(--seam);grid-template-columns:repeat(12,1fr)}
.contact-main{
  grid-column:span 8;background:var(--ply);
  padding:46px 44px 50px;
}
.contact-main h2{
  font-family:'Archivo Black',sans-serif;
  font-size:clamp(34px,4.4vw,58px);line-height:1;text-transform:uppercase;
}
.contact-main .big-tel{
  display:inline-block;margin-top:28px;
  font-family:'Archivo Black',sans-serif;
  font-size:clamp(30px,4.6vw,54px);
  color:var(--ink);text-decoration:none;
  border-bottom:6px solid var(--rust);
  line-height:1.15;
}
.contact-main .big-tel:hover{color:var(--rust)}
.contact-side{
  grid-column:span 4;background:var(--ply-pale);
  padding:30px 28px;
  display:flex;flex-direction:column;gap:18px;
}
.contact-side .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--label)}
.contact-side .v{font-size:16.5px;font-weight:600}
.contact-side .v a{color:var(--ink)}

/* ---------- footer ---------- */
footer{
  margin-top:var(--seam);
  background:var(--ink);color:var(--ply);
  padding:30px 24px;
}
.foot-inner{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 30px;align-items:center;justify-content:space-between}
footer .foot-brandmark{font-family:'Archivo Black',sans-serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
footer .f-mono{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
footer a{color:var(--ply);text-decoration:none}
footer a:hover{color:var(--rust)}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .hero-display{grid-column:span 12;grid-row:auto}
  .hero-logo,.hero-spec{grid-column:span 6}
  .svc-a,.svc-b{grid-column:span 12}
  .svc-c,.svc-tag,.svc-dots{grid-column:span 6}
  .contact-main,.contact-side{grid-column:span 12}
}
@media (max-width:640px){
  .peg-links a:not(.peg-tel){display:none}
  .peg-inner{flex-wrap:wrap}
  .peg-links{margin-left:0;width:100%}
  .peg-tel{flex:1 1 100%;text-align:center;margin-top:8px}
  .hero-logo,.hero-spec,.svc-c,.svc-tag,.svc-dots{grid-column:span 12}
  .appr{grid-template-columns:1fr}
  .cell{padding:24px 22px 28px}
  .hero-display{padding:32px 24px 36px}
  .contact-main{padding:32px 24px 38px}
}

/* ---------- reduced motion (required) ---------- */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
  .rv{opacity:1;transform:none}
}
</style>

  

<noscript><style>.rv{opacity:1!important;transform:none!important}</style></noscript>
</head>

        })
        .catch(function(err){
          st.textContent = (err && err.message) ? err.message : 'Could not send \u2014 please try again or call.';
          st.style.color = '#ff9d8a';
        })
        .finally(function(){ btn.disabled = false; });
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</section>
</body>
