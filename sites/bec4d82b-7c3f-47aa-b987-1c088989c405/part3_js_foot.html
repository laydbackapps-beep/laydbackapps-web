<script>
(function(){
  function init(){
    document.documentElement.classList.remove('no-js');
    var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var rv = document.querySelectorAll('.rv');
    rv.forEach(function(el){ el.classList.add('on'); });
    var hero = document.getElementById('hero');
    if(hero && !prefersReduced){
      hero.classList.add('drawn');
      var dr = hero.querySelector('.double-rule');
      if(dr) dr.classList.add('draw');
      initHeroCanvas();
    }else if(hero){
      hero.classList.add('drawn');
      var dr = hero.querySelector('.double-rule');
      if(dr) dr.classList.add('draw');
    }
    var sectionCloses = document.querySelectorAll('.double-rule.section-close');
    sectionCloses.forEach(function(rule, i){
      setTimeout(function(){
        rule.classList.add('draw');
      }, prefersReduced ? 0 : 200 + i * 150);
    });
    var burger = document.getElementById('burger');
    var nav = document.getElementById('nav');
    if(burger && nav){
      burger.addEventListener('click', function(){
        var open = nav.classList.toggle('open');
        burger.classList.toggle('open', open);
        burger.setAttribute('aria-expanded', open);
      });
    }
    var anchors = document.querySelectorAll('a[href^="#"]');
    anchors.forEach(function(a){
      a.addEventListener('click', function(e){
        var id = a.getAttribute('href').slice(1);
        var target = document.getElementById(id);
        if(target){
          e.preventDefault();
          target.scrollIntoView({behavior: prefersReduced ? 'auto' : 'smooth'});
          if(nav && nav.classList.contains('open')){
            nav.classList.remove('open');
            burger.classList.remove('open');
            burger.setAttribute('aria-expanded', 'false');
          }
        }
      });
    });
  }
  function initHeroCanvas(){
    var canvas = document.getElementById('hero-canvas');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var hero = document.getElementById('hero');
    var rafId = null;
    var t0 = performance.now();
    function resize(){
      var rect = hero.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      canvas.style.width = rect.width + 'px';
      canvas.style.height = rect.height + 'px';
      ctx.scale(dpr, dpr);
    }
    function draw(t){
      if(prefersReduced) return;
      var elapsed = (t - t0) / 1000;
      var rect = hero.getBoundingClientRect();
      var w = rect.width;
      var h = rect.height;
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(35,39,46,0.04)';
      ctx.lineWidth = 0.5;
      var spacing = 40;
      var offset = (elapsed * 8) % spacing;
      for(var x = -offset; x < w; x += spacing){
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for(var y = -offset; y < h; y += spacing){
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      var marginX = 32;
      ctx.strokeStyle = 'rgba(166,60,46,0.15)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(marginX, 0);
      ctx.lineTo(marginX, h);
      ctx.stroke();
      rafId = requestAnimationFrame(draw);
    }
    function start(){
      if(prefersReduced) return;
      resize();
      draw(performance.now());
      window.addEventListener('resize', resize);
    }
    if(document.readyState === 'complete'){
      start();
    }else{
      window.addEventListener('load', start);
    }
    window.addEventListener('beforeunload', function(){
      if(rafId) cancelAnimationFrame(rafId);
      window.removeEventListener('resize', resize);
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  }else{
    init();
  }
  setTimeout(function(){
    document.querySelectorAll('.rv:not(.on)').forEach(function(el){ el.classList.add('on'); });
    var hero = document.getElementById('hero');
    if(hero && !hero.classList.contains('drawn')){
      hero.classList.add('drawn');
      var dr = hero.querySelector('.double-rule');
      if(dr) dr.classList.add('draw');
    }
    document.querySelectorAll('.double-rule.section-close:not(.draw)').forEach(function(rule){
      rule.classList.add('draw');
    });
  }, 1100);
})();
</script>
</div>
</body>
</html>
