<main id="top" style="position:relative">
    <section class="hero" id="hero" aria-labelledby="hero-title" style="position:relative;min-height:100vh;display:flex;align-items:flex-start;padding:16vh clamp(1.5rem,4vw,3rem) 8vh;overflow:hidden">
      <canvas id="hero-canvas" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0"></canvas>
      <div class="hero-content" style="position:relative;z-index:1;max-width:var(--max-w);width:100%">
        <h1 id="hero-title" class="rv" style="font-size:clamp(2.2rem,5.5vw,4.2rem);font-weight:700;line-height:1.05;letter-spacing:-.03em;margin-bottom:1rem;color:var(--ink)">
          Formwork · Steelfixing · Concrete Construction
        </h1>
        <p class="rv" style="font-size:clamp(1rem,2vw,1.2rem);color:var(--muted);max-width:52ch;margin-bottom:2rem;line-height:1.7;font-family:var(--font-family-base)">
          B.I Concrete Constructions Pty Ltd — Norah Head based. Central Coast, Newcastle & Lake Macquarie.
        </p>
        <a href="#contact" class="rv btn" style="display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2rem;background:var(--accent);color:#0b0e12;border-radius:var(--radius);font-weight:700;font-size:.95rem;letter-spacing:.02em;transition:transform .2s var(--ease),box-shadow .2s var(--ease);box-shadow:0 4px 24px rgba(240,90,30,.35)" aria-label="Request a quote">
          Request a Quote
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
        </a>
      </div>
    </section>
    <style>
      .js .rv{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
      .js .rv.on{opacity:1;transform:none}
      .btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(240,90,30,.45)}
      .btn:active{transform:translateY(0)}
      @media (prefers-reduced-motion:reduce){
        .js .rv{opacity:0;transform:none;transition:none}
        .js .rv.on{opacity:1}
        .btn:hover{transform:none;box-shadow:0 4px 24px rgba(240,90,30,.35)}
        #hero-canvas{animation:none !important}
      }
      @media (max-width:390px){
        .hero{padding-top:14vh;padding-bottom:6vh}
        #hero-title{font-size:clamp(1.8rem,5vw,2.6rem)}
      }
    </style>
