<script>
    // REBAR-MESH 3D Hero — perspective lattice of rebar bars sliding into assembling mesh
    // Adapted from CANVAS-3D HERO RECIPE: project() varies BOTH axes; rAF-first-frame; isFinite guards
    (function(){
      var canvas = document.getElementById('hero-canvas');
      if(!canvas) return;
      var ctx = canvas.getContext('2d');
      var W = 0, H = 0, DPR = Math.max(1, window.devicePixelRatio || 1);
      var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var rafId = null, mouseX = -100, mouseY = -100;
      var horizon = 0, camH = 1.35, f = 0;
      var barsH = [], barsV = [];
      var phase = 0; // 0=horizontal arriving, 1=vertical locking, 2=calm shimmer
      var phaseTimer = 0;
      var settled = false;
      var staticDrawn = false;

      // Configuration
      var GRID_W = 22, GRID_D = 14; // grid cells
      var BAR_W = 0.12, BAR_H = 0.18; // bar dimensions in world units
      var SPACING = 1.0; // grid spacing
      var ARRIVE_DUR = 1.6; // seconds for horizontal bars
      var LOCK_DUR = 1.2; // seconds for vertical bars
      var SHIMMER_SPEED = 0.15;

      function resize(){
        var rect = canvas.getBoundingClientRect();
        W = Math.max(1, Math.floor(rect.width * DPR));
        H = Math.max(1, Math.floor(rect.height * DPR));
        canvas.width = W;
        canvas.height = H;
        horizon = H * 0.54;
        f = H * 1.15;
        // Recompute static draw on next frame
        staticDrawn = false;
      }

      function project(x, z){
        // Camera above floor looking down: near points LOW on screen, far points converge UP to horizon
        // s = f/z; x = W/2 + x*s; y = horizon + camH*f/z
        var zClamped = Math.max(0.9, z);
        var s = f / zClamped;
        var px = W * 0.5 + x * s;
        var py = horizon + camH * f / zClamped;
        return {x: px, y: py};
      }

      function initBars(){
        barsH = [];
        barsV = [];
        // Horizontal bars (along X, spaced in Z)
        for(var zi = 0; zi < GRID_D; zi++){
          var z = (zi - GRID_D * 0.5 + 0.5) * SPACING + 2.5; // start further back
          var delay = (zi / GRID_D) * ARRIVE_DUR * 0.6;
          barsH.push({z: z, delay: delay, progress: 0, settled: false, offset: (Math.random()-0.5)*0.3});
        }
        // Vertical bars (along Z, spaced in X)
        for(var xi = 0; xi < GRID_W; xi++){
          var x = (xi - GRID_W * 0.5 + 0.5) * SPACING;
          var delay = ARRIVE_DUR + (xi / GRID_W) * LOCK_DUR * 0.7;
          barsV.push({x: x, delay: delay, progress: 0, settled: false, offset: (Math.random()-0.5)*0.3});
        }
      }

      function drawBarH(ctx, bar, t){
        // Horizontal bar: extends along X at fixed Z
        var z = bar.z;
        var maxX = (GRID_W * 0.5) * SPACING;
        // Progress controls how far the bar has "slid in" from the sides
        var reveal = Math.max(0, Math.min(1, (t - bar.delay) / (ARRIVE_DUR * 0.4)));
        if(reveal <= 0) return;
        var easeReveal = reveal < 0.5 ? 2*reveal*reveal : 1 - Math.pow(-2*reveal+2, 2)/2;
        var curHalfW = maxX * easeReveal;
        var p1 = project(-curHalfW, z);
        var p2 = project(curHalfW, z);
        if(!isFinite(p1.x) || !isFinite(p1.y) || !isFinite(p2.x) || !isFinite(p2.y)) return;
        var alpha = 0.15 + 0.35 * easeReveal;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = 'rgba(42,43,47,' + alpha + ')';
        ctx.lineWidth = Math.max(1, Math.floor(2.5 * DPR * (0.6 + 0.4 * easeReveal)));
        ctx.lineCap = 'round';
        ctx.stroke();
        // Settlement shimmer
        if(bar.settled && phase >= 2){
          var sh = Math.sin(t * SHIMMER_SPEED * 2.4 + bar.z * 2.1) * 0.35 + 0.65;
          ctx.strokeStyle = 'rgba(240,90,30,' + (0.16 * sh) + ')';
          ctx.lineWidth = Math.max(1, Math.floor(1.5 * DPR));
          ctx.stroke();
        }
      }

      function drawBarV(ctx, bar, t){
        // Vertical bar: extends along Z at fixed X
        var x = bar.x;
        var maxZ = (GRID_D * 0.5) * SPACING + 2.5;
        var minZ = 2.5;
        var reveal = Math.max(0, Math.min(1, (t - bar.delay) / (LOCK_DUR * 0.5)));
        if(reveal <= 0) return;
        var easeReveal = reveal < 0.5 ? 2*reveal*reveal : 1 - Math.pow(-2*reveal+2, 2)/2;
        var curZ = minZ + (maxZ - minZ) * easeReveal;
        var p1 = project(x, minZ);
        var p2 = project(x, curZ);
        if(!isFinite(p1.x) || !isFinite(p1.y) || !isFinite(p2.x) || !isFinite(p2.y)) return;
        var alpha = 0.12 + 0.38 * easeReveal;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = 'rgba(42,43,47,' + alpha + ')';
        ctx.lineWidth = Math.max(1, Math.floor(2.5 * DPR * (0.6 + 0.4 * easeReveal)));
        ctx.lineCap = 'round';
        ctx.stroke();
        // Settlement shimmer
        if(bar.settled && phase >= 2){
          var sh = Math.sin(t * SHIMMER_SPEED * 6 + bar.x * 1.7) * 0.08 + 0.92;
          ctx.strokeStyle = 'rgba(240,90,30,' + (0.16 * sh) + ')';
          ctx.lineWidth = Math.max(1, Math.floor(1.5 * DPR));
          ctx.stroke();
        }
      }

      function drawIntersections(ctx, t){
        // Draw subtle intersection highlights where H and V bars cross
        if(phase < 2) return;
        for(var i = 0; i < barsH.length; i++){
          var bh = barsH[i];
          if(!bh.settled) continue;
          for(var j = 0; j < barsV.length; j++){
            var bv = barsV[j];
            if(!bv.settled) continue;
            var p = project(bv.x, bh.z);
            if(!isFinite(p.x) || !isFinite(p.y)) continue;
            var sh = Math.sin(t * SHIMMER_SPEED * 2.2 + i * 0.7 + j * 0.3) * 0.5 + 0.5;
            var r = Math.max(1.5, Math.floor(3.2 * DPR * (0.4 + 0.6 * sh)));
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(240,90,30,' + (0.5 * sh) + ')';
            ctx.fill();
          }
        }
      }

      function animate(ts){
        var t = ts * 0.001;
        // Phase management
        if(phase === 0 && t > ARRIVE_DUR * 1.2){
          phase = 1;
          barsH.forEach(function(b){ b.settled = true; });
        }
        if(phase === 1 && t > ARRIVE_DUR + LOCK_DUR * 1.3){
          phase = 2;
          barsV.forEach(function(b){ b.settled = true; });
          settled = true;
        }

        ctx.clearRect(0, 0, W, H);

        // Background subtle gradient
        var grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, 'rgba(42,43,47,0.02)');
        grad.addColorStop(1, 'rgba(42,43,47,0.005)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Draw horizontal bars
        for(var i = 0; i < barsH.length; i++){
          drawBarH(ctx, barsH[i], t);
        }
        // Draw vertical bars
        for(var j = 0; j < barsV.length; j++){
          drawBarV(ctx, barsV[j], t);
        }
        // Draw intersections
        drawIntersections(ctx, t);

        // Reduced motion: draw static final state and stop
        if(prefersReduced && !staticDrawn){
          // Fast-forward to settled state
          var finalT = ARRIVE_DUR + LOCK_DUR + 1;
          ctx.clearRect(0, 0, W, H);
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);
          for(var i = 0; i < barsH.length; i++){ barsH[i].settled = true; drawBarH(ctx, barsH[i], finalT); }
          for(var j = 0; j < barsV.length; j++){ barsV[j].settled = true; drawBarV(ctx, barsV[j], finalT); }
          drawIntersections(ctx, finalT);
          staticDrawn = true;
          rafId = null;
          return;
        }

        if(!prefersReduced || !staticDrawn){
          rafId = requestAnimationFrame(animate);
        }
      }

      function start(){
        if(rafId) cancelAnimationFrame(rafId);
        resize();
        initBars();
        // Initial draw for reduced-motion
        if(prefersReduced){
          var finalT = ARRIVE_DUR + LOCK_DUR + 1;
          ctx.clearRect(0, 0, W, H);
          var grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, 'rgba(42,43,47,0.02)');
          grad.addColorStop(1, 'rgba(42,43,47,0.005)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);
          for(var i = 0; i < barsH.length; i++){ barsH[i].settled = true; drawBarH(ctx, barsH[i], finalT); }
          for(var j = 0; j < barsV.length; j++){ barsV[j].settled = true; drawBarV(ctx, barsV[j], finalT); }
          drawIntersections(ctx, finalT);
          staticDrawn = true;
          return;
        }
        // rAF-first-frame law
        rafId = requestAnimationFrame(animate);
      }

      // Pointer sentinel
      canvas.addEventListener('mousemove', function(e){
        var rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
      });
      canvas.addEventListener('mouseleave', function(){
        mouseX = -100;
        mouseY = -100;
      });

      // Resize observer
      var ro = new ResizeObserver(function(){
        resize();
      });
      ro.observe(canvas);

      // Media query listener for reduced motion
      var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      mq.addEventListener('change', function(e){
        prefersReduced = e.matches;
        if(prefersReduced && rafId){
          cancelAnimationFrame(rafId);
          rafId = null;
          // Redraw static
          var finalT = ARRIVE_DUR + LOCK_DUR + 1;
          ctx.clearRect(0, 0, W, H);
          var grad = ctx.createLinearGradient(0, 0, 0, H);
          grad.addColorStop(0, 'rgba(42,43,47,0.02)');
          grad.addColorStop(1, 'rgba(42,43,47,0.005)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);
          for(var i = 0; i < barsH.length; i++){ barsH[i].settled = true; drawBarH(ctx, barsH[i], finalT); }
          for(var j = 0; j < barsV.length; j++){ barsV[j].settled = true; drawBarV(ctx, barsV[j], finalT); }
          drawIntersections(ctx, finalT);
          staticDrawn = true;
        }else if(!prefersReduced && !rafId){
          start();
        }
      });

      // Start on DOM ready
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', start);
      }else{
        start();
      }
    })();
  </script>
  <script>
    // Reveal system with DOMContentLoaded guard (pitfall #6)
    (function(){
      function startRv(){
        var rv = document.querySelectorAll('.rv');
        if(!rv.length) return;
        var observer = new IntersectionObserver(function(entries){
          entries.forEach(function(entry){
            if(entry.isIntersecting){
              entry.target.classList.add('on');
              observer.unobserve(entry.target);
            }
          });
        }, {rootMargin: '0px 0px -10% 0px', threshold: 0.08});
        rv.forEach(function(el){ observer.observe(el); });
        // JS safety net ~1100ms (pitfall #6)
        setTimeout(function(){
          document.querySelectorAll('.rv:not(.on)').forEach(function(el){ el.classList.add('on'); });
        }, 1100);
      }
      if(document.readyState === 'loading'){
        document.addEventListener('DOMContentLoaded', startRv);
      }else{
        startRv();
      }
    })();
    // Nav toggle
    (function(){
      var toggle = document.querySelector('.nav-toggle');
      var links = document.querySelector('.nav-links');
      if(toggle && links){
        toggle.addEventListener('click', function(){
          var open = links.classList.toggle('open');
          toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        links.querySelectorAll('a').forEach(function(a){
          a.addEventListener('click', function(){
            links.classList.remove('open');
            toggle.setAttribute('aria-expanded', 'false');
          });
        });
      }
    })();
  </script>
</body>
</html>
