<style>
:root{
  --board:#1b4434;
  --board-deep:#14362a;
  --board-edge:#0f2b21;
  --paper:#f7f2e5;
  --paper-dim:rgba(247,242,229,.74);
  --note:#fbf7ea;
  --sun:#e9c46a;
  --sun-deep:#d9ad4b;
  --rust:#b34f1e;
  --rust-deep:#93400f;
  --ink:#2b3630;
  --note-muted:#61695f;
  --cork:rgba(233,196,106,.075);
  --cork2:rgba(247,242,229,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:var(--board);
  background-image:
    radial-gradient(var(--cork) 1.4px,transparent 1.7px),
    radial-gradient(var(--cork2) 1px,transparent 1.3px);
  background-size:11px 11px,17px 17px;
  background-position:0 0,5px 8px;
  color:var(--paper);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:650;line-height:1.1;letter-spacing:-.005em}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

/* ---------- tape rule + topbar ---------- */
.taperule{height:8px;background:var(--sun)}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  max-width:1120px;margin:0 auto;padding:20px 28px 16px;
}
.wordmark{
  display:inline-block;
  font-weight:700;font-size:19px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--paper);line-height:1.2;
}
.wordmark small{
  display:block;font-weight:500;font-size:10.5px;letter-spacing:.46em;
  color:var(--sun);margin-top:1px;
}
.chip-tel{
  display:inline-block;white-space:nowrap;
  font-weight:700;font-size:15px;letter-spacing:.04em;
  color:var(--board-deep);background:var(--paper);
  padding:11px 20px;
  box-shadow:4px 4px 0 rgba(15,43,33,.55);
  transition:box-shadow .18s ease,transform .18s ease;
}
.chip-tel:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 rgba(15,43,33,.55)}

/* ---------- reveal system ---------- */
.js .rv{opacity:0;transform:translateY(22px);transition: opacity .45s ease,transform .7s ease}
.js .rv.on{opacity:1;transform:none}
.js .t-l.rv{transform:rotate(-1.6deg) translateY(22px)}
.js .t-l.rv.on{transform:rotate(-1.6deg)}
.js .t-r.rv{transform:rotate(1.8deg) translateY(22px)}
.js .t-r.rv.on{transform:rotate(1.8deg)}
.js .t-l2.rv{transform:rotate(-2.2deg) translateY(22px)}
.js .t-l2.rv.on{transform:rotate(-2.2deg)}
.js .t-r2.rv{transform:rotate(1.2deg) translateY(22px)}
.js .t-r2.rv.on{transform:rotate(1.2deg)}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}

/* ---------- hero on the board ---------- */
.hero{
  position:relative;overflow:hidden;
  padding:clamp(56px,8vw,108px) 0 clamp(64px,8vw,112px);
  background-image:radial-gradient(780px 480px at 82% -5%,rgba(233,196,106,.13),transparent 62%);
}
.hero-grid{display:grid;grid-template-columns:1fr;gap:clamp(24px,3vw,40px);align-items:start}
.kicker{
  display:inline-flex;align-items:center;gap:12px;
  font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--sun);margin-bottom:24px;
}
.kicker::before{content:'';width:34px;height:8px;background:var(--sun);transform:rotate(-2deg)}
.hero h1{font-size:clamp(42px,5.6vw,76px);color:var(--paper);margin-bottom:24px}
.hero h1 em{
  font-style:italic;font-weight:500;color:var(--sun);
  background:linear-gradient(transparent 70%,rgba(179,79,30,.45) 70%);
}
.lede{font-size:clamp(16px,1.6vw,19px);color:var(--paper-dim);max-width:33em;margin-bottom:34px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.btn{
  display:inline-block;font-weight:700;font-size:15px;
  padding:14px 26px;transition:transform .18s ease,box-shadow .18s ease;
}
.btn-solid{background:var(--sun);color:var(--board-deep);box-shadow:5px 5px 0 rgba(15,43,33,.6)}
.btn-solid:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 rgba(15,43,33,.6)}
.btn-ghost{border:2px solid var(--paper-dim);color:var(--paper)}
.btn-ghost:hover{border-color:var(--sun);color:var(--sun)}

/* ---------- paper notes ---------- */
.note{
  position:relative;
  background:var(--note);
  color:var(--ink);
  box-shadow:0 18px 34px rgba(10,25,19,.42),0 3px 8px rgba(10,25,19,.3);
  padding:32px 28px 26px;
}
.note::before{
  content:'';position:absolute;top:-13px;left:50%;width:26px;height:26px;margin-left:-13px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#d96a35,var(--rust) 58%,var(--rust-deep));
  box-shadow:0 5px 8px rgba(10,25,19,.5),inset 0 -3px 5px rgba(0,0,0,.25);
}
.note.corner::before{left:28px;margin-left:0}
.note h3{font-size:25px;color:var(--board-deep);margin-bottom:6px}
.note .tag{
  font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;
  color:var(--rust-deep);margin-bottom:16px;
}
.note p{color:var(--note-muted)}
.note ul{list-style:none;margin-bottom:16px}
.note li{
  padding:10px 0 10px 26px;border-bottom:1px dashed #d9d0b8;
  font-weight:500;font-size:15.5px;position:relative;color:var(--ink);
}
.note li:last-child{border-bottom:none}
.note li::before{
  content:'';position:absolute;left:4px;top:50%;margin-top:-5px;
  width:10px;height:10px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#d96a35,var(--rust) 62%,var(--rust-deep));
}
.note .foot{font-size:13.5px;color:var(--note-muted);border-top:2px solid var(--board);padding-top:12px}
.hero-note{transform:rotate(-2.2deg);max-width:420px;margin-left:clamp(0px,8vw,120px);margin-top:calc(-1 * clamp(8px,2vw,24px))}

/* ---------- tape section markers ---------- */
.sec{padding:clamp(64px,8vw,110px) 0}
.tape{
  display:inline-block;
  background:var(--sun);
  color:var(--board-deep);
  font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  padding:7px 18px 8px;margin-bottom:18px;
  transform:rotate(-1.2deg);
  box-shadow:0 2px 6px rgba(10,25,19,.35);
  clip-path:polygon(2% 0,98% 4%,100% 96%,0 100%);
}
.sec h2{font-size:clamp(32px,3.8vw,52px);color:var(--paper);max-width:19em;margin-bottom:clamp(40px,5vw,60px)}

/* scope board: staggered notes */
.board{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4vw,48px)}
.board .note:nth-child(1){transform:rotate(-1.4deg)}
.board .note:nth-child(2){transform:rotate(1.6deg);margin-top:36px}
.board .note:nth-child(3){transform:rotate(1.1deg);margin-top:-14px}
.board .note:nth-child(4){transform:rotate(-1.8deg);margin-top:22px}
.board .note{transition:transform .25s ease,box-shadow .25s ease}
.board .note:hover{transform:rotate(0deg) translateY(-4px);box-shadow:0 24px 44px rgba(10,25,19,.5),0 4px 10px rgba(10,25,19,.35)}
.board .no{
  font-family:'Fraunces',serif;font-weight:500;font-size:15px;color:var(--rust-deep);
  letter-spacing:.12em;display:block;margin-bottom:10px;
}
.board h3{font-size:26px;color:var(--board-deep);margin-bottom:10px}
.board p{font-size:15.5px}

/* process: zigzag notes */
.process{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4vw,48px)}
.process .note:nth-child(1){transform:rotate(-1.1deg)}
.process .note:nth-child(2){transform:rotate(1.5deg);margin-top:46px}
.process .note:nth-child(3){transform:rotate(1.3deg);margin-top:-10px}
.process .note:nth-child(4){transform:rotate(-1.6deg);margin-top:32px}
.process .step-num{
  font-family:'Fraunces',serif;font-weight:650;font-size:58px;line-height:1;
  color:var(--rust);margin-bottom:8px;display:block;
}
.process h3{font-size:23px;color:var(--board-deep);margin-bottom:8px}
.process p{font-size:15.5px}

/* locality band: full sun block */
.sunband{
  background:var(--sun);
  color:var(--board-deep);
  padding:clamp(64px,8vw,104px) 0;
  border-top:4px solid var(--board-edge);
  border-bottom:4px solid var(--board-edge);
  background-image:repeating-linear-gradient(45deg,rgba(20,54,42,.05) 0 2px,transparent 2px 14px);
}
.sunband-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(32px,5vw,72px);align-items:center}
.sunband .tape{background:var(--board);color:var(--sun);transform:rotate(1.1deg)}
.sunband h2{color:var(--board-deep);font-size:clamp(32px,3.8vw,52px);margin-bottom:18px}
.sunband p{color:rgba(20,54,42,.82);max-width:31em;font-size:16.5px}
.sunband .stamp{
  display:inline-block;text-align:center;
  border:3px solid var(--board);outline:2px solid var(--board);outline-offset:3px;
  padding:16px 26px;transform:rotate(2.4deg);
  background:transparent;
}
.sunband .stamp-main{
  display:block;font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--board-deep);
}
.sunband .stamp-sub{
  display:block;font-weight:500;font-size:10px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--rust-deep);margin-top:3px;
}

/* contact */
.contact-panel{
  position:relative;
  background:var(--board-deep);
  padding:clamp(48px,6vw,80px) clamp(28px,5vw,72px);
  background-image:radial-gradient(560px 320px at 90% 10%,rgba(233,196,106,.12),transparent 60%);
  box-shadow:0 22px 44px rgba(10,25,19,.45);
}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,64px);align-items:center}
.contact-panel h2{color:var(--paper);font-size:clamp(32px,3.6vw,48px);margin-bottom:16px}
.contact-panel .contact-copy{color:var(--paper-dim);max-width:27em}
.contact-note{transform:rotate(-1.8deg)}
.contact-note h3{font-size:26px;color:var(--board-deep);margin-bottom:6px}
.tel-big{
  display:inline-block;
  font-family:'Fraunces',serif;font-weight:650;font-size:clamp(30px,3vw,40px);
  color:var(--rust-deep);
  border-bottom:3px solid rgba(147,64,15,.35);
  transition:border-color .18s ease,color .18s ease;
}
.tel-big:hover{color:var(--rust);border-color:var(--rust)}
.contact-note .foot{margin-top:16px}

/* footer */
.footer{background:var(--board-edge);padding:44px 0 40px}
.footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.footer .wordmark{font-size:14px}
.footer .wordmark small{font-size:9px}
.footer-meta{font-size:13.5px;color:rgba(247,242,229,.6)}
.footer a.tel-foot{color:var(--sun);font-weight:700;border-bottom:2px solid rgba(233,196,106,.4)}
.footer a.tel-foot:hover{border-color:var(--sun)}

/* ---------- responsive ---------- */
@media(max-width:920px){
  .hero-grid{grid-template-columns:1fr;gap:46px}
  .hero-note{max-width:480px}
  .sunband-grid{grid-template-columns:1fr;gap:38px}
  .contact-grid{grid-template-columns:1fr;gap:42px}
}
@media(max-width:760px){
  .board,.process{grid-template-columns:1fr}
  .board .note:nth-child(n),.process .note:nth-child(n){margin-top:0}
  .board .note:nth-child(1){transform:rotate(-.8deg)}
  .board .note:nth-child(2){transform:rotate(.9deg)}
  .board .note:nth-child(3){transform:rotate(.7deg)}
  .board .note:nth-child(4){transform:rotate(-1deg)}
  .process .note:nth-child(1){transform:rotate(-.7deg)}
  .process .note:nth-child(2){transform:rotate(.9deg)}
  .process .note:nth-child(3){transform:rotate(.8deg)}
  .process .note:nth-child(4){transform:rotate(-.9deg)}
  .board .note+.note,.process .note+.note{margin-top:28px}
  .topbar{padding:16px 20px 14px}
  .wrap{padding:0 20px}
  .chip-tel{font-size:13.5px;padding:9px 14px;box-shadow:3px 3px 0 rgba(15,43,33,.55)}
  .hero-note{transform:rotate(1deg)}
  .contact-note{transform:rotate(-1deg)}
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  .js .rv{opacity:1!important;transform:none!important;transition:none!important}
  .js .t-l.rv.on{transform:rotate(-1.6deg)!important}
  .js .t-r.rv.on{transform:rotate(1.8deg)!important}
  .js .t-l2.rv.on{transform:rotate(-2.2deg)!important}
  .js .t-r2.rv.on{transform:rotate(1.2deg)!important}
  .js .t-l.rv:not(.on),.js .t-r.rv:not(.on),.js .t-l2.rv:not(.on),.js .t-r2.rv:not(.on){transform:none!important}
  .board .note,.process .note{transition:none!important}
  .chip-tel,.btn,.tel-big{transition:none!important}
}
</style>

    var btn = f.querySelector('button[type=submit]');

      var d = {};
