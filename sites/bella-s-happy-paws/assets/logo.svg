<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" id="logo">
  <title>Bella's Happy Paws logo</title>
  <!-- Ground shadow - solid, no opacity -->
  <ellipse cx="128" cy="195" rx="70" ry="6" fill="#12151c"/>
  <!-- Dotted curved trail - as filled shapes, not stroke -->
  <path d="M32 128 C64 64, 192 64, 224 128" fill="none" stroke="#12151c" stroke-width="2" stroke-dasharray="5 8" stroke-linecap="round"/>
  <!-- Paw prints along trail - alternating sizes, all filled paths -->
  <!-- Large paw 1 (60, 90) -->
  <g transform="translate(60, 90)">
    <circle cx="0" cy="0" r="9" fill="#12151c"/>
    <circle cx="-11" cy="-9" r="4.5" fill="#12151c"/>
    <circle cx="11" cy="-9" r="4.5" fill="#12151c"/>
    <circle cx="-11" cy="7" r="4.5" fill="#12151c"/>
    <circle cx="11" cy="7" r="4.5" fill="#12151c"/>
  </g>
  <!-- Small paw 1 (100, 75) - larger now -->
  <g transform="translate(100, 75)">
    <circle cx="0" cy="0" r="6.5" fill="#12151c"/>
    <circle cx="-7.5" cy="-6" r="3.5" fill="#12151c"/>
    <circle cx="7.5" cy="-6" r="3.5" fill="#12151c"/>
    <circle cx="-7.5" cy="5" r="3.5" fill="#12151c"/>
    <circle cx="7.5" cy="5" r="3.5" fill="#12151c"/>
  </g>
  <!-- Large paw 2 (140, 70) -->
  <g transform="translate(140, 70)">
    <circle cx="0" cy="0" r="9" fill="#12151c"/>
    <circle cx="-11" cy="-9" r="4.5" fill="#12151c"/>
    <circle cx="11" cy="-9" r="4.5" fill="#12151c"/>
    <circle cx="-11" cy="7" r="4.5" fill="#12151c"/>
    <circle cx="11" cy="7" r="4.5" fill="#12151c"/>
  </g>
  <!-- Small paw 2 (180, 80) - larger now -->
  <g transform="translate(180, 80)">
    <circle cx="0" cy="0" r="6.5" fill="#12151c"/>
    <circle cx="-7.5" cy="-6" r="3.5" fill="#12151c"/>
    <circle cx="7.5" cy="-6" r="3.5" fill="#12151c"/>
    <circle cx="-7.5" cy="5" r="3.5" fill="#12151c"/>
    <circle cx="7.5" cy="5" r="3.5" fill="#12151c"/>
  </g>
  <!-- Lead/harness curl at start - filled path -->
  <path d="M32 128 C20 110, 20 90, 35 80 C38 78, 42 78, 44 80" fill="#12151c"/>
  <!-- Grooming station outline at trail end - all filled -->
  <g transform="translate(200, 110)">
    <!-- Table/base -->
    <rect x="-20" y="10" width="40" height="5" rx="1" fill="#12151c"/>
    <!-- Legs -->
    <rect x="-18" y="15" width="4" height="18" rx="0.5" fill="#12151c"/>
    <rect x="14" y="15" width="4" height="18" rx="0.5" fill="#12151c"/>
    <!-- Arm/post -->
    <rect x="-2" y="-32" width="4" height="42" rx="1" fill="#12151c"/>
    <!-- Arm horizontal -->
    <rect x="-2" y="-32" width="26" height="4" rx="1" fill="#12151c"/>
    <!-- Hook/loop - filled -->
    <path d="M24 -32 C28 -32, 30 -28, 28 -24 C28 -20, 26 -18, 24 -18 C22 -18, 20 -20, 20 -24 C20 -28, 22 -32, 24 -32 Z" fill="#12151c"/>
    <!-- Small grooming tool hint - filled rectangles -->
    <rect x="15" y="-27" width="2" height="10" rx="0.5" fill="#12151c"/>
    <rect x="13" y="-23" width="6" height="2" rx="0.5" fill="#12151c"/>
  </g>
</svg>