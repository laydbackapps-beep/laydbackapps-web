<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 100" width="590" height="100" role="img" aria-label="Savi Developments">
  <title>Savi Developments</title>
  <defs>
    <style>
      .rk{fill:none;stroke:#b8728a;stroke-linecap:round;stroke-linejoin:round}
      .tx{font-family:"Arial Black","Archivo Black",Impact,system-ui,sans-serif;font-weight:800;font-size:42px;letter-spacing:.5px}
    </style>
  </defs>
  <g transform="translate(4,0)">
    <!-- broken ring: visible arc runs 10 o'clock -> 12 -> 3 -> 5 o'clock (gap lower-left) -->
    <circle cx="50" cy="50" r="40" class="rk" stroke-width="7"
            stroke-dasharray="146.6 104.7" transform="rotate(210 50 50)"/>
    <!-- roof, chimney and smoke -->
    <path class="rk" stroke-width="6" d="M33 52 L33 44 L50 29 L67 44 L67 52"/>
    <path class="rk" stroke-width="5" d="M39 37 L39 26 L46 26 L46 32"/>
    <path class="rk" stroke-width="4" d="M42 21 q4 -3 0 -6"/>
    <path class="rk" stroke-width="4" d="M48 20 q4 -3 0 -6"/>
  </g>
  <text class="tx" x="122" y="65"><tspan fill="#b8728a">SAVI</tspan><tspan fill="#f4f2ec" dx="12">DEVELOPMENTS</tspan></text>
</svg>
