<style>
:root{
  --teal:#0f3d3e;
  --teal-deep:#0a2c2d;
  --teal-lift:#155657;
  --tan:#c9a876;
  --tan-deep:#a8834f;
  --tan-ink:#7d5f33;
  --wash:#e6d7bd;
  --paper:#f4f1ea;
  --ink:#12211f;
  --ink-soft:#4c5a56;
  --sage:#cfe0dc;
  --disp:'Zilla Slab', 'Roboto Slab', serif;
  --body:'Source Sans 3', 'Segoe UI', Arial, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--body);
  color:var(--ink);
  background:var(--teal);
  font-size:17px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(20px,4vw,48px)}
.skip{position:absolute;left:-9999px;top:0;background:var(--tan);color:var(--ink);padding:10px 16px;z-index:99;font-weight:600}
.skip:focus{left:12px;top:12px}

/* ---------- annotations (drafting labels) ---------- */
.ann{
  font-family:var(--body);font-weight:600;font-size:.75rem;
  letter-spacing:.22em;text-transform:uppercase;
}
.ann .tick{color:var(--tan-deep)}

/* ---------- header ---------- */
header{
  background:var(--teal-deep);
  border-bottom:1px solid rgba(201,168,118,.35);
  position:relative;z-index:5;
}
.hd{
  display:flex;align-items:center;justify-content:space-between;
  gap:20px;padding-block:18px;
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:34px;height:34px;flex-shrink:0}
.brand .wm{
  font-family:var(--disp);font-weight:600;font-size:1.12rem;
  color:var(--paper);letter-spacing:.02em;white-space:nowrap;
}
nav.main{display:flex;gap:26px;align-items:center}
nav.main a{
  color:var(--sage);text-decoration:none;font-size:.92rem;font-weight:500;
  letter-spacing:.06em;text-transform:uppercase;
}
nav.main a:hover{color:var(--tan)}
.hd-tel{
  color:var(--tan);text-decoration:none;font-weight:600;font-size:1rem;
  white-space:nowrap;flex-shrink:0;letter-spacing:.03em;
  border:1px solid rgba(201,168,118,.5);padding:8px 14px;
}
.hd-tel:hover{background:var(--tan);color:var(--ink)}
@media (max-width:860px){ nav.main{display:none} }

/* ---------- hero ---------- */
.hero{
  background:var(--teal);
  position:relative;
  padding-block:clamp(40px,6vw,72px) 0;
  overflow:hidden;
}
.hero-top{display:flex;justify-content:space-between;gap:16px;margin-bottom:clamp(24px,4vw,44px)}
.hero-top .ann{color:var(--sage)}
.gable-frame{
  position:relative;
  max-width:980px;margin-inline:auto;
  padding:clamp(96px,17vw,190px) clamp(28px,8vw,110px) clamp(40px,6vw,64px);
  margin-bottom:clamp(48px,7vw,84px);
}
.gable-frame svg.frame{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;
}
.gable-frame svg.frame .s1{stroke:var(--tan);stroke-width:2.5;fill:none;vector-effect:non-scaling-stroke}
.gable-frame svg.frame .s2{stroke:var(--tan);stroke-width:1.25;fill:none;opacity:.55;vector-effect:non-scaling-stroke}
.gable-frame svg.frame .s3{stroke:var(--sage);stroke-width:1.25;fill:none;opacity:.5;vector-effect:non-scaling-stroke}
.gable-inner{position:relative;text-align:center;max-width:760px;margin-inline:auto}
.hero h1{
  font-family:var(--disp);font-weight:600;text-transform:uppercase;
  color:var(--paper);
  font-size:clamp(2.3rem,6.2vw,4.4rem);
  line-height:1.04;letter-spacing:.01em;
}
.hero h1 .dim{color:var(--tan);display:block}
.hero .sub{
  color:var(--sage);max-width:560px;margin:20px auto 0;
  font-size:clamp(1rem,1.6vw,1.15rem);
}
.cta{
  display:inline-block;margin-top:30px;
  background:var(--tan);color:var(--ink);
  font-weight:600;font-size:1.02rem;letter-spacing:.02em;
  text-decoration:none;padding:15px 30px;
  box-shadow:5px 5px 0 rgba(10,44,45,.55);
}
.cta:hover{background:var(--paper)}
.hero-note{
  position:absolute;right:clamp(20px,4vw,48px);bottom:calc(clamp(52px,7vw,88px) + 10px);
  color:var(--sage);opacity:.75;
}
/* roofline divider between sections */
.roof{line-height:0;background:transparent}
.roof svg{width:100%;height:clamp(52px,7vw,88px);display:block}
.roof.flip svg{transform:scaleX(-1)}

/* ---------- generic section ---------- */
section{position:relative}
.sec-pad{padding-block:clamp(72px,10vw,124px)}
.light{background:var(--paper);color:var(--ink)}
.dark{background:var(--teal);color:var(--paper)}
.wash{background:var(--wash);color:var(--ink)}
.sec-head{margin-bottom:clamp(36px,5vw,56px)}
.sec-head .ann{color:var(--tan-ink)}
.dark .sec-head .ann{color:var(--tan)}
.sec-head h2{
  font-family:var(--disp);font-weight:600;text-transform:uppercase;
  font-size:clamp(1.9rem,4vw,2.9rem);line-height:1.08;margin-top:14px;
  letter-spacing:.01em;
}
.light .sec-head h2{color:var(--teal)}
.dark .sec-head h2{color:var(--paper)}
.wash .sec-head h2{color:var(--teal)}
.sec-head .lede{margin-top:14px;max-width:620px;font-size:1.06rem}
.light .sec-head .lede{color:var(--ink-soft)}
.wash .sec-head .lede{color:var(--ink-soft)}

/* ---------- 01 scope: shed-door panels ---------- */
.doors{
  display:grid;grid-template-columns:repeat(12,1fr);
  gap:clamp(18px,2.5vw,26px);
}
.door{
  position:relative;
  background:var(--wash);
  border:2px solid var(--tan-deep);
  padding:clamp(24px,3vw,34px);
  box-shadow:7px 7px 0 rgba(15,61,62,.10);
}
/* vertical batten planks behind the inner plate */
.door::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,
    transparent 0 44px, rgba(125,95,51,.22) 44px 47px);
  pointer-events:none;
}
/* diagonal brace across the top-left corner */
.door::after{
  content:"";position:absolute;left:-2px;top:-2px;
  width:86px;height:86px;
  background:linear-gradient(to bottom right,
    transparent calc(50% - 2.5px), var(--tan-deep) calc(50% - 2.5px),
    var(--tan-deep) calc(50% + 2.5px), transparent calc(50% + 2.5px));
  opacity:.8;
}
.door .plate{
  position:relative;background:var(--paper);
  border:1px solid rgba(125,95,51,.4);
  padding:clamp(20px,2.6vw,30px);
}
.door .num{
  font-family:var(--disp);font-weight:700;font-size:2rem;
  color:var(--tan-deep);line-height:1;
}
.door h3{
  font-family:var(--disp);font-weight:600;font-size:1.35rem;
  color:var(--teal);margin-top:12px;letter-spacing:.01em;
}
.door p{margin-top:10px;color:var(--ink-soft);font-size:.98rem}
.door.d1{grid-column:1/8}
.door.d2{grid-column:8/13;margin-top:38px}
.door.d3{grid-column:1/6}
.door.d4{grid-column:6/13;margin-top:38px}
@media (max-width:820px){
  .door.d1,.door.d2,.door.d3,.door.d4{grid-column:1/13;margin-top:0}
}

/* ---------- 02 approach: stepped ridge beam ---------- */
.steps{max-width:860px}
.step{
  display:grid;grid-template-columns:auto 1fr;gap:clamp(18px,3vw,30px);
  align-items:start;
}
.step .beam{
  grid-column:1/3;height:9px;background:var(--tan);
  position:relative;margin-bottom:22px;
}
.step .beam::after{ /* pitch notch on the beam end */
  content:"";position:absolute;right:-16px;top:0;
  border-left:16px solid var(--tan);
  border-top:9px solid transparent;
}
.step .tag{
  background:var(--tan);color:var(--ink);
  font-family:var(--disp);font-weight:700;font-size:1.6rem;
  width:74px;height:74px;display:flex;align-items:center;justify-content:center;
  box-shadow:4px 4px 0 rgba(10,44,45,.5);
  position:relative;
}
.step .tag::before,.step .tag::after{ /* nail dots */
  content:"";position:absolute;width:5px;height:5px;border-radius:50%;
  background:rgba(18,33,31,.55);
}
.step .tag::before{left:7px;top:7px}
.step .tag::after{right:7px;bottom:7px}
.step h3{
  font-family:var(--disp);font-weight:600;font-size:1.3rem;
  color:var(--paper);letter-spacing:.01em;
}
.step p{color:var(--sage);margin-top:8px;max-width:560px;font-size:.99rem}
.step.s1{margin-left:0}
.step.s2{margin-left:clamp(0px,7vw,84px)}
.step.s3{margin-left:clamp(0px,14vw,168px)}
.step + .step{margin-top:34px}

/* ---------- 03 ground ---------- */
.ground{position:relative;overflow:hidden}
.ground .contours{position:absolute;inset:auto 0 0 0;width:100%;height:150px;opacity:.5;pointer-events:none}
.ground .inner{position:relative;max-width:680px}
.ground .big{
  font-family:var(--disp);font-weight:600;font-size:clamp(1.7rem,3.4vw,2.5rem);
  color:var(--teal);line-height:1.15;letter-spacing:.01em;
}
.ground p{margin-top:16px;color:var(--ink-soft);max-width:560px}
.ground .tel-inline{
  color:#6b4f28;font-weight:600;text-decoration:none;
  border-bottom:2px solid var(--tan-deep);white-space:nowrap;
}
.ground .tel-inline:hover{color:var(--teal)}

/* ---------- 04 contact ---------- */
.contact .gable-echo{
  width:min(420px,80%);margin:0 auto clamp(24px,4vw,40px);
}
.contact .gable-echo .s1{stroke:var(--tan);stroke-width:2.5;fill:none;vector-effect:non-scaling-stroke}
.contact .gable-echo .s3{stroke:var(--sage);stroke-width:1.25;fill:none;opacity:.5;vector-effect:non-scaling-stroke}
.contact{text-align:center}
.contact .sec-head .lede{margin-inline:auto}
.tel-big{
  font-family:var(--disp);font-weight:700;
  font-size:clamp(2.2rem,6vw,3.8rem);
  color:var(--paper);text-decoration:none;letter-spacing:.02em;
  display:inline-block;margin-top:8px;
}
.tel-big:hover{color:var(--tan)}
.contact .cta{margin-top:26px}
.contact .scope-strip{
  margin-top:34px;color:var(--sage);
  font-size:.85rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
}

/* ---------- footer ---------- */
footer{
  background:var(--teal-deep);
  border-top:2px solid var(--tan-deep);
  color:var(--sage);
}
.ft{
  display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;
  padding-block:34px;
}
.ft .wm{font-family:var(--disp);font-weight:600;color:var(--paper);font-size:1.05rem}
.ft nav{display:flex;gap:20px;flex-wrap:wrap}
.ft nav a{color:var(--sage);text-decoration:none;font-size:.9rem}
.ft nav a:hover{color:var(--tan)}
.ft .ft-tel{color:var(--tan);text-decoration:none;font-weight:600;white-space:nowrap}
.ft .legal{
  border-top:1px solid rgba(201,168,118,.25);
  padding-block:18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;
  font-size:.82rem;color:rgba(207,224,220,.75);
}

/* ---------- reveals ---------- */
.rv{opacity:0;transform:translateY(16px);transition: opacity .45s ease,transform .6s ease}
.rv.on{opacity:1;transform:none}

/* ---------- reduced motion (REQUIRED) ---------- */
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rv{opacity:1!important;transform:none!important}
}
</style>



<noscript><style>.rv{opacity:1!important;transform:none!important}</style></noscript>
</head>

setTimeout(function() {
    var hiddenEls = document.querySelectorAll('.rv, .step, [class*="hide"], [class*="hidden"]');
    hiddenEls.forEach(function(el) {
        el.style.opacity = "1";
        el.style.transform = "none";
    });
}, 1100);
// JS Safety net: reveal all hidden elements after 1100ms (matching reference pattern)

    if (!f) return;
    var st = document.getElementById('lbq-st');
    var btn = f.querySelector('button[type=submit]');
    f.addEventListener('submit', function(e){
      e.preventDefault();
      var d = {};
