<script>
(function(){
  var b = document.getElementById('burger'), n = document.getElementById('navlinks');
  if (b && n){
    b.addEventListener('click', function(){
      var open = n.classList.toggle('open');
      b.classList.toggle('open', open);
      b.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    n.addEventListener('click', function(e){
      if (e.target.tagName === 'A'){ n.classList.remove('open'); b.classList.remove('open'); b.setAttribute('aria-expanded','false'); }
    });
  }
})();

(function(){
  var els = document.querySelectorAll('.drop');
  if ('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, {threshold: 0.12, rootMargin: '0px 0px -40px 0px'});
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add('in'); });
  }
})();

setTimeout(function(){
  document.querySelectorAll('.drop').forEach(function(el){ el.classList.add('in'); });
}, 1100);


(function(){
  var c = document.getElementById('heroCanvas');
  if (!c || !c.getContext) return;
  var ctx = c.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var px = 0, py = 0;
  window.addEventListener('pointermove', function(e){
    px = (e.clientX / window.innerWidth - 0.5) * 16;
    py = (e.clientY / window.innerHeight - 0.5) * 9;
  }, {passive: true});
  function resize(){
    W = c.clientWidth || c.offsetWidth;
    H = c.clientHeight || c.offsetHeight;
    if (!W || !H) return;
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function loop(t){
    if (!W || !H){ resize(); return; }
    frame(t || 0);
    if (!reduce) requestAnimationFrame(loop);
  }
  function frame(t){

    var time = t * 0.001;
    ctx.clearRect(0,0,W,H);
    var g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2C3222'); g.addColorStop(.5,'#232A1A'); g.addColorStop(1,'#161B10');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    /* lawn base band */
    var lg3 = ctx.createLinearGradient(0,H*0.4,0,H);
    lg3.addColorStop(0,'rgba(88,110,50,0.10)');
    lg3.addColorStop(1,'rgba(70,90,40,0.20)');
    ctx.fillStyle = lg3; ctx.fillRect(0, H*0.4, W, H*0.6);

    /* bluestone stepping stones receding in perspective */
    var stones = 6;
    for (var st=0; st<stones; st++){
      var depth = st/(stones-1);              /* 0 far -> 1 near */
      var sy2 = H*(0.30 + depth*0.62) + py*(0.3+depth*0.5);
      var sscale = 0.16 + depth*0.72;
      var sw2 = W*0.20*sscale;
      var sh2 = H*0.075*sscale;
      var sx2 = W*0.5 + Math.sin(st*1.7)*W*0.045 - W*0.06 + px*(0.5+depth*0.7);
      /* stone */
      ctx.fillStyle = 'rgba(84,96,116,' + (0.28 + depth*0.22) + ')';
      ctx.beginPath();
      ctx.moveTo(sx2 - sw2*0.5, sy2);
      ctx.lineTo(sx2 + sw2*0.5, sy2);
      ctx.lineTo(sx2 + sw2*0.42, sy2 + sh2);
      ctx.lineTo(sx2 - sw2*0.42, sy2 + sh2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(170,185,205,' + (0.10 + depth*0.10) + ')';
      ctx.lineWidth = 1.2; ctx.stroke();
      /* grass between */
    }

    /* plant silhouettes either side */
    var tufts = [[0.08,0.55],[0.16,0.68],[0.78,0.60],[0.90,0.72],[0.70,0.44],[0.28,0.42]];
    for (var tu=0; tu<tufts.length; tu++){
      var tx2 = W*tufts[tu][0] + px*(0.5+tu*0.1);
      var ty2 = H*tufts[tu][1] + py*0.4;
      var blades = 7;
      for (var bl=0; bl<blades; bl++){
        var bang = -Math.PI/2 + (bl-(blades-1)/2)*0.22 + Math.sin(time*0.7+tu*2+bl)*0.05;
        var blen = 34 + (bl%3)*16;
        ctx.strokeStyle = 'rgba(120,148,70,' + (0.24 - Math.abs(bl-(blades-1)/2)*0.03) + ')';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(tx2, ty2);
        ctx.quadraticCurveTo(tx2 + Math.cos(bang)*blen*0.6, ty2 + Math.sin(bang)*blen*0.7,
                             tx2 + Math.cos(bang)*blen, ty2 + Math.sin(bang)*blen);
        ctx.stroke();
      }
    }

    /* warm sun glow top-right */
    var sg2 = ctx.createRadialGradient(W*0.82,H*0.10,10,W*0.82,H*0.10,H*0.55);
    sg2.addColorStop(0,'rgba(240,226,170,0.16)'); sg2.addColorStop(1,'rgba(240,226,170,0)');
    ctx.fillStyle = sg2; ctx.fillRect(0,0,W,H);

    var vg = ctx.createRadialGradient(W*0.5,H*0.5,H*0.3,W*0.5,H*0.5,H*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.40)');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(loop);
})();
</script>
