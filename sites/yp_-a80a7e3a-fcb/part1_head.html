<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">

<title>Trent Lantry Electrical — Electrician, Rutherford / Maitland NSW</title>
<meta name="description" content="Trent Lantry Electrical — electrical services across Rutherford, Maitland and the Hunter Valley. Lighting, power points, switchboards, safety switches, fault finding. Call 0400 444 179.">
<meta property="og:title" content="Trent Lantry Electrical — Electrician, Rutherford / Maitland NSW">
<meta property="og:description" content="Electrical services across Rutherford, Maitland and the Hunter Valley. Lighting, power points, switchboards, safety switches, fault finding.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fafafa'/%3E%3Cpath d='M8 16h16M16 8v16' stroke='%231a1a1a' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%237a4b2a' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#fafafa;
  --paper-2:#f3f3f1;
  --ink:#1a1a1a;
  --ink-2:#2d2d2d;
  --muted:#6b6b6b;
  --line:#e8e6e0;
  --line-strong:#d4d0c8;
  --conductor-brown:#7a4b2a;
  --conductor-blue:#2e5fa3;
  --conductor-green:#2e8b57;
  --conductor-yellow:#e3c63b;
  --focus:#2e5fa3;
  --shadow:rgba(26,26,26,.08);
  --shadow-strong:rgba(26,26,26,.14);
  --font-display:'Oxanium',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'Source Code Pro',ui-monospace,monospace;
}
*, *::before, *::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  font-family:var(--font-display);
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  font-size:17px;
  font-weight:400;
}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.wrap{width:min(1100px,92vw);margin-inline:auto}

/* reveal — html.js-gated */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease-out,transform .7s ease-out}
.js .rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .js .rv{opacity:1;transform:none;transition:none}
  *{animation-duration:.001s !important;transition-duration:.001s !important}
}

/* nav */
.nav{
  position:fixed;inset:0 0 auto 0;z-index:60;
  background:rgba(250,250,250,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav-in{
  display:flex;align-items:center;gap:1.25rem;height:72px
}
.brand{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--ink)}
.brand-mark{
  width:40px;height:40px;border-radius:8px;
  background:linear-gradient(135deg,var(--conductor-brown),var(--conductor-blue));
  display:grid;place-items:center;
}
.brand-mark svg{width:22px;height:22px;stroke:var(--paper);fill:none;stroke-width:2.2;stroke-linecap:round}
.brand-name{font-weight:600;font-size:1.05rem;letter-spacing:.01em;line-height:1}
.brand-tag{font-family:var(--font-mono);font-size:.55rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.nav-links{display:flex;gap:1.5rem;margin-left:auto;align-items:center}
.nav-links a{color:var(--ink-2);font-size:.85rem;font-weight:400;letter-spacing:.01em}
.nav-links a:hover{color:var(--ink)}
.nav-cta{
  background:var(--ink);color:var(--paper) !important;
  padding:.5rem 1.1rem;border-radius:6px;font-weight:600;font-size:.85rem;
  transition:transform .12s ease,filter .12s ease
}
.nav-cta:hover{transform:translateY(-1px);filter:brightness(1.1)}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line-strong);border-radius:6px;padding:.35rem .55rem;cursor:pointer}
.burger span{display:block;width:20px;height:2px;background:var(--ink);margin:4px 0;transition:.25s}
.burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
@media(max-width:880px){
  .nav-links{position:fixed;inset:72px 0 auto 0;background:var(--paper);flex-direction:column;padding:1.25rem;gap:1rem;transform:translateY(-140%);transition:transform .35s ease;border-bottom:1px solid var(--line)}
  .nav-links.open{transform:none}
  .nav-links a{width:100%;text-align:center;padding:.5rem 0;font-size:.95rem}
  .nav-cta{display:inline-block;margin-top:.3rem;width:100%;text-align:center}
  .burger{display:block}
}

/* hero — live conductors canvas */
.hero{
  position:relative;min-height:92vh;display:flex;align-items:flex-end;
  background:var(--paper);overflow:hidden;padding-top:72px
}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-shade{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(26,26,26,.02) 0%,rgba(26,26,26,0) 35%,rgba(26,26,26,.06) 100%);
  pointer-events:none
}
.hero-in{position:relative;z-index:2;padding-block:4rem 3rem;width:100%}
.hero-kicker{
  display:inline-flex;align-items:center;gap:.6rem;
  color:var(--conductor-brown);font-family:var(--font-mono);
  font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;font-weight:600;margin-bottom:.85rem
}
.hero-kicker::before{content:"";width:32px;height:2px;background:var(--conductor-brown)}
.hero h1{
  font-weight:600;font-size:clamp(2.2rem,5.5vw,4.2rem);line-height:1.12;
  color:var(--ink);letter-spacing:-.015em;max-width:22ch
}
.hero h1 em{font-style:normal;color:var(--conductor-blue)}
.hero-sub{
  margin-top:1rem;color:var(--muted);font-size:clamp(1rem,1.5vw,1.1rem);max-width:58ch;font-weight:400
}
.hero-cta{display:flex;gap:.85rem;margin-top:1.5rem;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:6px;
  text-decoration:none;font-weight:600;font-size:.9rem;transition:transform .12s ease,filter .12s ease
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-ghost{border:1.5px solid var(--line-strong);color:var(--ink);background:transparent}
.hero-strip{
  margin-top:2.2rem;display:flex;gap:2rem;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:1rem
}
.hero-strip p{
  color:var(--muted);font-family:var(--font-mono);
  font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500
}
.hero-strip strong{
  display:block;color:var(--ink);font-size:.9rem;letter-spacing:.01em;margin-top:.15rem;font-weight:500
}

/* sections */
section{padding-block:5rem}
.sec-head{display:flex;align-items:baseline;gap:1rem;margin-bottom:2.2rem}
.sec-head::before{content:"";width:36px;height:3px;background:var(--conductor-brown);flex:none;align-self:center;border-radius:2px}
.sec-kicker{
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--conductor-brown);font-weight:600
}
.sec-title{
  font-weight:500;font-size:clamp(1.5rem,3.5vw,2.3rem);line-height:1.22;
  letter-spacing:-.01em;margin-top:.25rem;max-width:26ch;color:var(--ink)
}
.sec-sub{color:var(--muted);max-width:58ch;margin-top:.7rem;font-weight:400}

/* services grid */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.svc{
  background:var(--paper-2);border:1px solid var(--line);border-radius:10px;
  padding:1.5rem 1.4rem;position:relative;overflow:hidden;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease
}
.svc:hover{border-color:var(--conductor-brown);transform:translateY(-2px);box-shadow:0 12px 28px var(--shadow-strong)}
.svc::before{
  content:"";position:absolute;top:0;left:0;width:6px;height:100%;
  background:linear-gradient(180deg,var(--conductor-brown),var(--conductor-blue),var(--conductor-green));
  opacity:0;transition:opacity .3s ease
}
.svc:hover::before{opacity:1}
.svc-tag{
  font-family:var(--font-mono);font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.6rem;display:inline-block
}
.svc h3{font-weight:500;font-size:1rem;letter-spacing:-.005em;color:var(--ink);margin-bottom:.3rem}
.svc p{color:var(--muted);font-size:.9rem;line-height:1.55;font-weight:400}

/* process band */
.band{
  background:var(--ink);color:var(--paper);border-block:1px solid var(--line-strong)
}
.band .sec-head::before{background:var(--conductor-yellow)}
.band .sec-kicker{color:var(--conductor-yellow)}
.band .sec-title{color:var(--paper)}
.band .sec-sub{color:rgba(250,250,250,.6)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.step{background:rgba(255,255,255,.03);border:1px solid var(--line-strong);border-radius:10px;padding:1.4rem 1.3rem}
.step-n{
  font-family:var(--font-mono);font-size:1.3rem;line-height:1;color:var(--conductor-yellow);
  margin-bottom:.45rem;font-weight:600
}
.step h3{font-weight:500;font-size:.9rem;letter-spacing:-.005em;color:var(--paper);margin-bottom:.25rem}
.step p{color:rgba(250,250,250,.6);font-size:.88rem;line-height:1.55;font-weight:400}

/* trust/why section */
.trust-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:start}
@media(max-width:880px){.trust-grid{grid-template-columns:1fr;gap:1.5rem}}
.trust-list{display:grid;gap:.95rem}
.trust-item{display:flex;gap:.85rem;align-items:flex-start}
.trust-dot{
  flex:none;width:22px;height:22px;border-radius:50%;
  background:var(--conductor-brown);display:grid;place-items:center;margin-top:.15rem
}
.trust-dot svg{width:11px;height:11px;stroke:var(--paper);fill:none;stroke-width:2.5;stroke-linecap:round}
.trust-item h3{font-weight:500;font-size:.95rem;letter-spacing:-.005em;color:var(--ink)}
.trust-item p{color:var(--muted);font-size:.88rem;margin-top:.1rem;font-weight:400}
.trust-visual{
  border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(135deg,var(--paper),var(--paper-2));
  padding:1.5rem;position:relative;overflow:hidden;display:grid;place-items:center
}
.trust-visual svg{width:min(260px,70%);opacity:.9}
.trust-visual p{color:var(--muted);margin-top:1rem;font-weight:400;font-size:.85rem;text-align:center}

/* service area */
.area-chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
.chip{
  border:1px solid var(--line-strong);border-radius:999px;padding:.45rem 1rem;
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);background:var(--paper);font-weight:500
  transition:border-color .2s ease,color .2s ease
}
.chip:hover{border-color:var(--conductor-brown);color:var(--conductor-brown)}

/* footer */
footer{background:var(--ink-2);color:rgba(250,250,250,.7);border-top:1px solid var(--line-strong);padding-block:3.5rem 1.5rem}
.foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:2rem}
@media(max-width:880px){.foot-grid{grid-template-columns:1fr;gap:1.5rem}}
.foot-brand{display:flex;gap:.75rem;align-items:center;margin-bottom:1rem}
.foot-brand .brand-mark{width:36px;height:36px}
.foot-brand-name{font-weight:600;color:var(--paper);font-size:1rem;letter-spacing:.01em;line-height:1}
.foot-brand-tag{font-family:var(--font-mono);font-size:.5rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.foot h4{font-weight:500;color:var(--paper);font-size:.88rem;letter-spacing:-.005em;margin-bottom:.65rem}
.foot p,.foot a{font-size:.85rem;line-height:1.75;color:rgba(250,250,250,.65);text-decoration:none;font-weight:400}
.foot a:hover{color:var(--paper)}
.foot-tel{font-family:var(--font-mono);font-size:.85rem;letter-spacing:.01em;color:var(--conductor-yellow);border-bottom:1px solid transparent;transition:border-color .2s}
.foot-tel:hover{border-color:var(--conductor-yellow)}
.foot-bottom{
  border-top:1px solid rgba(255,255,255,.08);padding-top:1.25rem;margin-top:2.5rem;
  display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  font-family:var(--font-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(250,250,250,.4)
}
.foot-bottom a{color:rgba(250,250,250,.55)}
.foot-bottom a:hover{color:var(--paper)}
</style>
</head>
