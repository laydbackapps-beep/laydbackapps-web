<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- Canopy section - arborist diagram style -->
  <!-- Trunk with bark texture hint -->
  <path d="M118 180 Q118 160 128 140 Q138 160 138 180" fill="#000000"/>
  <!-- Trunk base / chipper inlet -->
  <rect x="108" y="180" width="40" height="12" rx="2" fill="#000000"/>
  <!-- Drop zone arc -->
  <path d="M80 180 Q128 140 176 180" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Rigging line -->
  <line x1="128" y1="140" x2="128" y2="80" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 4"/>
  <!-- Canopy outline - upper canopy mass -->
  <path d="M60 140 Q40 100 80 60 Q128 30 176 60 Q216 100 196 140 Q170 150 140 145 Q116 150 90 145 Q60 150 60 140Z" fill="#000000" fill-opacity="0.3"/>
  <!-- Canopy inner detail - branch structure hint -->
  <path d="M80 110 Q90 90 110 85 Q130 80 145 85 Q155 90 165 110" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M100 95 Q115 75 140 72 Q155 75 160 95" stroke="#000000" stroke-width="1" fill="none" stroke-linecap="round" stroke-dasharray="4 3"/>
  <!-- Branch collar detail at trunk junction -->
  <ellipse cx="128" cy="140" rx="18" ry="6" fill="none" stroke="#000000" stroke-width="2"/>
  <!-- Small accent mark - lime accent dot for rigging attachment -->
  <circle cx="128" cy="80" r="4" fill="#000000"/>
</svg>